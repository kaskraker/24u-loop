<style>
  :root { --ink: #17120d; --butter: #fff1cf; --orange: #f2a342; --deep: #e8590c; --brown: #863c14; --ok: #2fb344; --bad: #dc2626; --muted: #6a5a48; --cream: #fff6df; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { font-family: 'Bricolage Grotesque', system-ui, sans-serif; background: var(--butter); color: var(--ink); font-variant-numeric: tabular-nums; padding-bottom: 90px; user-select: none; -webkit-user-select: none; }
  header { background: var(--orange); border-bottom: 3px solid var(--ink); padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  header .ttl { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header .logo { flex: none; background: #fff; border: 3px solid var(--ink); border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); padding: 2px 7px; display: flex; }
  header .logo img { height: 20px; width: auto; display: block; }
  .envpill { display: inline-block; background: var(--deep); color: #fff; font-size: 11px; font-weight: 800; border: 2px solid var(--ink); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 3px 10px; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .chip.off i { background: var(--bad); animation: pulse 1s infinite; } .chip.sync i { background: #3b82f6; animation: pulse 1s infinite; } .chip.wait i { background: #9ca3af; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .banner { margin: 10px 14px 0; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; font-weight: 700; font-size: 14px; background: #fde68a; box-shadow: 3px 3px 0 var(--ink); }
  .banner.red { background: #fecaca; }
  main { padding: 12px 20px 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--ink); padding: 14px; }

  .now { background: #ffd58a; text-align: center; }

  .now .k .dot { width: 9px; height: 9px; border-radius: 50%; background: #e24b4a; animation: pulse 1.4s ease-in-out infinite; }
  .facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; }
  .facts span { font-size: 13px; font-weight: 800; background: var(--cream); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .facts span small { font-weight: 600; color: var(--muted); margin-right: 4px; }
  .nextc { padding: 10px 14px; text-align: center; }
  .nextc .lbl { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .nextc .nm2 { font-size: 20px; font-weight: 800; line-height: 1.15; }
  .now .nm { font-size: 30px; font-weight: 800; line-height: 1.1; margin-top: 2px; }
  .now .clk { font-size: 76px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; margin: 4px 0; }
  .now .sub { font-size: 13px; color: var(--muted); font-weight: 500; }
  .big { width: 100%; min-height: 104px; font: inherit; font-size: 28px; font-weight: 800; border: 4px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); background: var(--ok); color: var(--ink); padding: 14px; line-height: 1.1; transition: transform .08s, box-shadow .08s; }
  .big small { display: block; font-size: 15px; font-weight: 700; margin-top: 4px; }
  .big:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: 1px 1px 0 var(--ink); }
  .big.stop { background: #fecaca; } .big.wait { background: #e5e7eb; box-shadow: 3px 3px 0 var(--ink); }
  .big:disabled { opacity: .7; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { font: inherit; font-weight: 800; font-size: 15px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink); padding: 12px 10px; box-shadow: 3px 3px 0 var(--ink); min-height: 50px; }
  .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn:disabled { opacity: .4; box-shadow: none; }
  .btn.primary { background: var(--orange); } .btn.danger { background: #fecaca; } .btn.ok { background: #d9f7d0; }
  .btn.small { min-height: 38px; padding: 6px 10px; font-size: 14px; box-shadow: 2px 2px 0 var(--ink); border-width: 2px; }
  .undo { background: #fff6df; border: 3px dashed var(--ink); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
  .undo b { flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 12px; background: var(--cream); margin-bottom: 6px; }
  .row.run { background: #ffd58a; border: 2px solid var(--ink); }
  .row .no { width: 24px; font-weight: 800; color: var(--muted); text-align: center; }
  .row .nm { flex: 1; min-width: 0; font-weight: 700; } .row .nm small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
  .row .w { text-align: right; font-weight: 800; font-size: 16px; white-space: nowrap; line-height: 1.1; } .row .w small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .ib { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); box-shadow: 2px 2px 0 var(--ink); padding: 0; }
  .ib:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
  .ib:disabled { opacity: .3; box-shadow: none; }
  .ib.red { background: #fecaca; }
  .ib svg { width: 20px; height: 20px; display: block; }
  .lrow { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; background: var(--cream); margin-bottom: 8px; }
  .lrow .main { flex: 1; min-width: 0; } .lrow .main b { display: block; font-size: 17px; line-height: 1.15; overflow-wrap: anywhere; } .lrow .main small { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 4px; }
  .lrow .t { font-size: 19px; font-weight: 800; white-space: nowrap; }
  .big.hold { touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; position: relative; overflow: hidden; background-image: linear-gradient(90deg, rgba(23,18,13,.28) calc(var(--p, 0) * 100%), rgba(23,18,13,0) calc(var(--p, 0) * 100%)); }
  .big.hold .hint { display: block; font-size: 13px; font-weight: 700; margin-top: 6px; opacity: .8; }
  .corr { display: flex; gap: 8px; align-items: center; } .corr b { font-size: 13px; } .corr .btn { flex: 1; }

  nav button { flex: 1; min-width: 0; font: inherit; font-weight: 800; font-size: 14px; padding: 10px 2px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  nav button.on { background: var(--orange); }
  input.in { font: inherit; font-size: 20px; width: 100%; border: 3px solid var(--ink); border-radius: 12px; padding: 12px; background: #fff; margin: 10px 0; user-select: text; -webkit-user-select: text; }
  .modal { position: fixed; inset: 0; z-index: 100; background: rgba(23,18,13,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal .box { background: #fff; border: 4px solid var(--ink); border-radius: 18px; box-shadow: 6px 6px 0 var(--ink); padding: 18px; width: 100%; max-width: 420px; }
  .modal h3 { font-size: 22px; font-weight: 800; margin-bottom: 6px; } .modal p { white-space: pre-line; font-weight: 500; }
  .toast { position: fixed; left: 14px; right: 14px; bottom: 86px; z-index: 90; background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 14px; font-weight: 700; text-align: center; max-width: 520px; margin: 0 auto; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--cream); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 10px; }
  .tile .tk { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .tile .tv { font-size: 26px; font-weight: 800; line-height: 1.1; } .tile .tv small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 10px; }
  .seg button { font: inherit; font-weight: 800; font-size: 15px; border: 2px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); padding: 10px 4px; box-shadow: 2px 2px 0 var(--ink); }
  .seg button.on { background: var(--orange); box-shadow: inset 2px 2px 0 rgba(23,18,13,.25); }
  .lbl2 { font-size: 13px; font-weight: 700; color: var(--muted); }
  .sres .row { cursor: pointer; }
  /* tijdnemer-modus: enkel het nodige, grote knop vast onderaan (schuift nooit op) */
  .now { position: relative; }
  .khead { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .khead.split { justify-content: space-between; }
  .focusin { flex: none; font: inherit; font-size: 12px; font-weight: 800; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); padding: 3px 9px; box-shadow: 2px 2px 0 var(--ink); }
  body.focus header, body.focus nav, body.focus #banner { display: none; }
  body.focus { padding-bottom: calc(150px + env(safe-area-inset-bottom)); padding-top: env(safe-area-inset-top); }
  body.focus .big.fixed { position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); width: auto; max-width: 532px; margin: 0 auto; z-index: 30; }
  body.focus main { padding-top: 58px; }   /* plaats voor het kruisje en een eventuele meldingsbalk */
  body.focus .toast { top: calc(10px + env(safe-area-inset-top)); bottom: auto; }
  .fx { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 10px; z-index: 40; width: 40px; height: 40px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font: inherit; font-size: 20px; font-weight: 800; box-shadow: 2px 2px 0 var(--ink); display: grid; place-items: center; padding: 0; }
  .bigrow { display: flex; gap: 10px; align-items: stretch; }
  .bigrow .big { flex: 1; min-width: 0; }
  .oops { flex: none; width: 86px; font: inherit; font-weight: 800; font-size: 16px; line-height: 1.1; color: var(--ink); background: #fca5a5; border: 4px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); padding: 6px; }
  .oops:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--ink); }
  body.focus .bigrow.fixed { position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); max-width: 532px; margin: 0 auto; z-index: 30; }
  .sheet h4 { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
  .sheet .btn { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
  .sheet .btn small { display: block; font-weight: 600; font-size: 12px; color: var(--muted); }
  .sheet .adj4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; } .sheet .adj4 .btn { text-align: center; margin: 0; padding: 10px 2px; }
  .sheet .adj { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; } .sheet .adj .btn { text-align: center; margin: 0; }
  .fx.more { right: 58px; }
  .slim { position: fixed; top: env(safe-area-inset-top); left: 0; right: 106px; z-index: 35; background: #fecaca; border-bottom: 3px solid var(--ink); font-size: 13px; font-weight: 800; padding: 6px 12px; }
  .inst { font-size: 14px; font-weight: 600; line-height: 1.5; } .inst b { font-weight: 800; }
  .sec { margin-top: 4px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
</style>

<body>
<header><div class="ttl"><span class="logo"><img src="humasol_logo.png" alt="Humasol"></span><div style="min-width:0;line-height:1.1"><h1>Chronometer</h1><span id="env"></span></div></div><span class="chip wait" id="chip" style="cursor:pointer"><i></i><span id="chipTxt">Verbinden…</span></span><div id="sig" style="display:none;position:fixed;top:58px;right:10px;z-index:80;min-width:230px;background:#fff;color:#17120d;border:3px solid #17120d;border-radius:14px;box-shadow:4px 4px 0 #17120d;padding:10px 14px;font-size:14px"></div></header>
<div id="banner"></div>
<main id="view"></main>
<nav id="nav"></nav>
<div id="fxBox"></div>
<div id="overlay"></div>

<div id="toastBox"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDVULWNjHaR41EaptoQYnWnTdnU-suMuuA", authDomain: "u-loop-leuven-2026.firebaseapp.com", projectId: "u-loop-leuven-2026",
  storageBucket: "u-loop-leuven-2026.firebasestorage.app", messagingSenderId: "1032849674125", appId: "1:1032849674125:web:110054a3b61ba10eedb7c4"
};
const params = new URLSearchParams(location.search);
// Naam van het beginscherm-icoon: oefen en echt zijn zo te onderscheiden (en de pagina bewaart zijn eigen link, inclusief ?ns=)
(function () { const ns = (params.get('ns') || '').replace(/[^a-zA-Z0-9_-]/g, ''); const t = ns ? 'Chrono OEFEN' : 'Chrono'; if (ns === 'oefen') document.getElementById('manifest').href = 'chrono-oefen.webmanifest'; const m = document.querySelector('meta[name=apple-mobile-web-app-title]'); if (m) m.content = t; document.title = ns ? '24u Loop · Chronometer (oefen)' : '24u Loop · Chronometer'; })();
const NS = (params.get('ns') || '').replace(/[^a-zA-Z0-9_-]/g, '');
const col = (n) => NS ? `${NS}_${n}` : n;
const $ = (id) => document.getElementById(id);

// ===== Gedeelde tijd (zie loper.html): klok corrigeren met de servertijd =====
let TIME_OFFSET = 0;
const tnow = () => Date.now() + TIME_OFFSET;
async function syncClock() {
  try {
    let lo = -Infinity, hi = Infinity;
    for (let i = 0; i < 6; i++) {
      const t0 = Date.now();
      const res = await fetch(location.pathname + '?_t=' + t0 + '_' + i, { method: 'HEAD', cache: 'no-store' });
      const t1 = Date.now(), d = res.headers.get('Date');
      if (!d) continue;
      const mid = (t0 + t1) / 2, srv = new Date(d).getTime();
      lo = Math.max(lo, srv - mid); hi = Math.min(hi, srv + 1000 - mid);
      await new Promise((r) => setTimeout(r, 170));
    }
    if (isFinite(lo) && isFinite(hi)) { const est = (lo + hi) / 2; if (Math.abs(est) < 10 * 60e3) TIME_OFFSET = est; }
  } catch (e) {}
}
syncClock(); setInterval(syncClock, 10 * 60e3);

// ===== Firebase met offline-opslag =====
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// ===== Medewerkers-pincode (eenmalig per toestel) =====
// Het toestel meldt zich aan bij Firebase met een gedeeld medewerkersaccount; het wachtwoord is de pincode + een vast achtervoegsel.
// Zet STAFF_LOGIN_REQUIRED op true zodra het account bestaat in Firebase (Authentication) en de beveiligingsregels zijn aangepast.
const STAFF_LOGIN_REQUIRED = false;
const STAFF_EMAIL = 'staff@24u-loop.humasol.app';
const STAFF_PW_SUFFIX = '-humasol-24u';
function staffGate(onReady) {
  if (!STAFF_LOGIN_REQUIRED || !firebase.auth) { onReady(); return; }
  const auth = firebase.auth(); let started = false;
  const go = () => { if (!started) { started = true; onReady(); } };
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff1cf;display:none;align-items:center;justify-content:center;padding:20px;font-family:"Bricolage Grotesque",system-ui,sans-serif';
  box.innerHTML = '<div style="background:#fff;border:4px solid #17120d;border-radius:20px;box-shadow:6px 6px 0 #17120d;padding:22px;width:100%;max-width:380px;text-align:center"><div style="font-size:24px;font-weight:800;margin-bottom:6px">Medewerkers</div><div style="font-weight:500;margin-bottom:14px">Voer de pincode in. Dit hoef je maar één keer te doen op dit toestel.</div><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="Pincode" style="font:inherit;font-size:28px;text-align:center;width:100%;border:3px solid #17120d;border-radius:12px;padding:12px;margin-bottom:10px;letter-spacing:.3em"><div id="pinErr" style="color:#dc2626;font-weight:700;min-height:22px;margin-bottom:6px"></div><button id="pinGo" style="font:inherit;font-weight:800;font-size:18px;width:100%;border:3px solid #17120d;border-radius:14px;background:#f2a342;padding:14px;box-shadow:3px 3px 0 #17120d">Ontgrendelen</button></div>';
  document.body.appendChild(box);
  const submit = async () => {
    const pin = box.querySelector('#pinIn').value.trim(); if (!pin) return;
    box.querySelector('#pinErr').textContent = '';
    try { await auth.signInWithEmailAndPassword(STAFF_EMAIL, pin + STAFF_PW_SUFFIX); }
    catch (e) { box.querySelector('#pinErr').textContent = (e.code === 'auth/too-many-requests') ? 'Te veel pogingen. Wacht even.' : (e.code === 'auth/network-request-failed') ? 'Geen internet. Probeer opnieuw.' : 'Onjuiste pincode.'; box.querySelector('#pinIn').value = ''; }
  };
  box.querySelector('#pinGo').onclick = submit; box.querySelector('#pinIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  auth.onAuthStateChanged((u) => { if (u) { box.style.display = 'none'; go(); } else { box.style.display = 'flex'; setTimeout(() => box.querySelector('#pinIn').focus(), 100); } });
}

let persistence = 'unknown';
db.enablePersistence({ synchronizeTabs: false }).then(() => { persistence = 'on'; }).catch((e) => { persistence = 'off:' + e.code; });
const FV = firebase.firestore.FieldValue;
const ref = (name, id) => id ? db.collection(col(name)).doc(id) : db.collection(col(name));

let runners = [], laps = [], queue = [], activeDocs = [], loaded = { runners: false, laps: false, queue: false, active: false };
let tab = params.get('tab') || 'chrono', lastAction = null, busyUntil = 0, pending = 0, lastCacheFalse = 0, offlineSince = 0, lastOK = 0;
try { lastAction = JSON.parse(localStorage.getItem('lastAction_' + NS) || 'null'); } catch (e) {}

// ===== helpers =====
// knoppen om de laatste ronde bij te stellen: '−' = te laat gedrukt (ronde korter), '+' = te vroeg gedrukt (ronde langer)
const adjBtns = (vals, last, cls = '') => vals.map((v) => `<button class="btn ${cls}" data-adj="${v * 1000}"${last ? ' data-last="1"' : ''}>${v > 0 ? '−' : '+'}${Math.abs(v)} s</button>`).join('');
const ICO = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I_USER = ICO('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>');

// ===== Samenvatting voor de lopers-app: de chronometer schrijft elke ~2 min een kleine samenvatting, zodat gsm's niet alle rondes hoeven te lezen =====
function buildMeta(runnersArr, lapsArr) {
  const by = {};
  lapsArr.forEach((l) => { const e = by[l.runnerId] || (by[l.runnerId] = { n: 0, tt: 0, best: Infinity, sq: 0 }); e.n++; e.tt += l.time; if (l.time < e.best) e.best = l.time; });
  lapsArr.forEach((l) => { const e = by[l.runnerId], m = e.tt / e.n; e.sq += (l.time - m) * (l.time - m); });
  const seqs = {}, lastAt = {}; [...lapsArr].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)).forEach((l) => { (seqs[l.runnerId] = seqs[l.runnerId] || []).push(l.time); lastAt[l.runnerId] = new Date(l.timestamp).getTime(); });
  const list = runnersArr.map((r) => { const e = by[r.id]; return { i: r.id, n: r.name || '', g: r.gender || 'X', l: e ? e.n : 0, t: e ? Math.round(e.tt) : 0, b: e ? Math.round(e.best) : 0, s: e && e.n >= 3 ? +(Math.sqrt(e.sq / e.n) / (e.tt / e.n)).toFixed(3) : 0, e: e ? Math.round(predictNext(seqs[r.id] || [], r.gender, Date.now() - (lastAt[r.id] || Date.now()))) : 0 }; });
  const gOf = {}; runnersArr.forEach((r) => { gOf[r.id] = r.gender; });
  const sorted = [...lapsArr].sort((a, b) => a.time - b.time);
  const top = (arr) => arr.slice(0, 10).map((l) => ({ id: l.runnerId, name: l.runnerName, t: l.time, at: l.timestamp }));
  const most = list.filter((x) => x.l > 0).sort((a, b) => b.l - a.l).slice(0, 10).map((x) => ({ id: x.i, name: x.n, n: x.l }));
  const now = Date.now();
  return {
    index: { updatedAt: now, list },
    summary: { updatedAt: now, total: lapsArr.length, record: sorted[0] ? { t: sorted[0].time, name: sorted[0].runnerName } : null,
      top: { fast: top(sorted), fastM: top(sorted.filter((l) => gOf[l.runnerId] === 'M')), fastV: top(sorted.filter((l) => gOf[l.runnerId] === 'V')), most } }
  };
}

// Signaalsterkte: tik op de chip. Browsers geven geen wifi-dBm, dus we meten de reactietijd naar de server (enkel terwijl het paneel open staat, sluit na 1 min)

    + (ping !== undefined ? row('Reactietijd', ping == null ? 'geen antwoord' : ping + ' ms') : '') + (avg != null ? row('Gemiddeld', avg + ' ms') : '')
