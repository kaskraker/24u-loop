<!doctype html>

<style>
  :root { --ink: #17120d; --butter: #fff1cf; --orange: #f2a342; --deep: #e8590c; --brown: #863c14; --ok: #2fb344; --bad: #dc2626; --muted: #6a5a48; --cream: #fff6df; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { font-family: 'Bricolage Grotesque', system-ui, sans-serif; background: var(--butter); color: var(--ink); font-variant-numeric: tabular-nums; padding-bottom: 90px; user-select: none; -webkit-user-select: none; }
  header { background: var(--orange); border-bottom: 3px solid var(--ink); padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  header .ttl { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header .logo { flex: none; background: #fff; border: 3px solid var(--ink); border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); padding: 2px 7px; display: flex; }
  header .logo img { height: 20px; width: auto; display: block; }
  .envpill { display: inline-block; background: var(--deep); color: #fff; font-size: 11px; font-weight: 800; border: 2px solid var(--ink); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 3px 10px; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .chip.off i { background: var(--bad); animation: pulse 1s infinite; } .chip.sync i { background: #3b82f6; animation: pulse 1s infinite; } .chip.wait i { background: #9ca3af; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .banner { margin: 10px 14px 0; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; font-weight: 700; font-size: 14px; background: #fde68a; box-shadow: 3px 3px 0 var(--ink); }
  .banner.red { background: #fecaca; }
  main { padding: 12px 20px 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--ink); padding: 14px; }
  .card h2 { font-size: 18px; font-weight: 800; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .now { background: #ffd58a; text-align: center; }
  .now .k { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 1px 11px; }
  .now .k .dot { width: 9px; height: 9px; border-radius: 50%; background: #e24b4a; animation: pulse 1.4s ease-in-out infinite; }
  .facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; }
  .facts span { font-size: 13px; font-weight: 800; background: var(--cream); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .facts span small { font-weight: 600; color: var(--muted); margin-right: 4px; }
  .nextc { padding: 10px 14px; text-align: center; }
  .nextc .lbl { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .nextc .nm2 { font-size: 20px; font-weight: 800; line-height: 1.15; }
  .now .nm { font-size: 30px; font-weight: 800; line-height: 1.1; margin-top: 2px; }
  .now .clk { font-size: 76px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; margin: 4px 0; }
  .now .sub { font-size: 13px; color: var(--muted); font-weight: 500; }
  .big { width: 100%; min-height: 104px; font: inherit; font-size: 28px; font-weight: 800; border: 4px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); background: var(--ok); color: var(--ink); padding: 14px; line-height: 1.1; transition: transform .08s, box-shadow .08s; }
  .big small { display: block; font-size: 15px; font-weight: 700; margin-top: 4px; }
  .big:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: 1px 1px 0 var(--ink); }
  .big.stop { background: #fecaca; } .big.wait { background: #e5e7eb; box-shadow: 3px 3px 0 var(--ink); }
  .big:disabled { opacity: .7; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { font: inherit; font-weight: 800; font-size: 15px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink); padding: 12px 10px; box-shadow: 3px 3px 0 var(--ink); min-height: 50px; }
  .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn:disabled { opacity: .4; box-shadow: none; }
  .btn.primary { background: var(--orange); } .btn.danger { background: #fecaca; } .btn.ok { background: #d9f7d0; }
  .btn.small { min-height: 38px; padding: 6px 10px; font-size: 14px; box-shadow: 2px 2px 0 var(--ink); border-width: 2px; }
  .undo { background: #fff6df; border: 3px dashed var(--ink); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
  .undo b { flex: 1; min-width: 0; }

  .row.run { background: #ffd58a; border: 2px solid var(--ink); }
  .row .no { width: 24px; font-weight: 800; color: var(--muted); text-align: center; }
  .row .nm { flex: 1; min-width: 0; font-weight: 700; } .row .nm small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
  .row .w { text-align: right; font-weight: 800; font-size: 16px; white-space: nowrap; line-height: 1.1; } .row .w small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .ib { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); box-shadow: 2px 2px 0 var(--ink); padding: 0; }
  .ib:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
  .ib:disabled { opacity: .3; box-shadow: none; }
  .ib.red { background: #fecaca; }
  .ib svg { width: 20px; height: 20px; display: block; }
  .lrow { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; background: var(--cream); margin-bottom: 8px; }
  .lrow .main { flex: 1; min-width: 0; } .lrow .main b { display: block; font-size: 17px; line-height: 1.15; overflow-wrap: anywhere; } .lrow .main small { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 4px; }
  .lrow .t { font-size: 19px; font-weight: 800; white-space: nowrap; }
  .big.hold { touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; position: relative; overflow: hidden; background-image: linear-gradient(90deg, rgba(23,18,13,.28) calc(var(--p, 0) * 100%), rgba(23,18,13,0) calc(var(--p, 0) * 100%)); }
  .big.hold .hint { display: block; font-size: 13px; font-weight: 700; margin-top: 6px; opacity: .8; }
  .corr { display: flex; gap: 8px; align-items: center; } .corr b { font-size: 13px; } .corr .btn { flex: 1; }
  .pick { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
  .hapL { position: fixed; left: -99px; top: -99px; opacity: 0; pointer-events: none; }
  .empty { text-align: center; color: var(--muted); padding: 14px 0; font-weight: 500; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 8px; padding: 8px 14px calc(8px + env(safe-area-inset-bottom)); background: var(--butter); border-top: 3px solid var(--ink); }
  nav button { flex: 1; min-width: 0; font: inherit; font-weight: 800; font-size: 14px; padding: 10px 2px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  nav button.on { background: var(--orange); }
  input.in { font: inherit; font-size: 20px; width: 100%; border: 3px solid var(--ink); border-radius: 12px; padding: 12px; background: #fff; margin: 10px 0; user-select: text; -webkit-user-select: text; }
  .modal { position: fixed; inset: 0; z-index: 100; background: rgba(23,18,13,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal .box { background: #fff; border: 4px solid var(--ink); border-radius: 18px; box-shadow: 6px 6px 0 var(--ink); padding: 18px; width: 100%; max-width: 420px; }
  .modal h3 { font-size: 22px; font-weight: 800; margin-bottom: 6px; } .modal p { white-space: pre-line; font-weight: 500; }
  .toast { position: fixed; left: 14px; right: 14px; bottom: 86px; z-index: 90; background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 14px; font-weight: 700; text-align: center; max-width: 520px; margin: 0 auto; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sec { margin-top: 4px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
</style>

<body>
<header><div class="ttl"><span class="logo"><img src="humasol_logo.png" alt="Humasol"></span><div style="min-width:0;line-height:1.1"><h1>Chronometer</h1><span id="env"></span></div></div><span class="chip wait" id="chip"><i></i><span id="chipTxt">Verbinden…</span></span></header>
<div id="banner"></div>
<main id="view"></main>
<nav id="nav"></nav>
<div id="overlay"></div>

<div id="toastBox"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDVULWNjHaR41EaptoQYnWnTdnU-suMuuA", authDomain: "u-loop-leuven-2026.firebaseapp.com", projectId: "u-loop-leuven-2026",
  storageBucket: "u-loop-leuven-2026.firebasestorage.app", messagingSenderId: "1032849674125", appId: "1:1032849674125:web:110054a3b61ba10eedb7c4"
};
const params = new URLSearchParams(location.search);
// Naam van het beginscherm-icoon: oefen en echt zijn zo te onderscheiden (en de pagina bewaart zijn eigen link, inclusief ?ns=)
(function () { const ns = (params.get('ns') || '').replace(/[^a-zA-Z0-9_-]/g, ''); const t = ns ? 'Chrono OEFEN' : 'Chrono'; const m = document.querySelector('meta[name=apple-mobile-web-app-title]'); if (m) m.content = t; document.title = ns ? '24u Loop · Chronometer (oefen)' : '24u Loop · Chronometer'; })();
const NS = (params.get('ns') || '').replace(/[^a-zA-Z0-9_-]/g, '');
const col = (n) => NS ? `${NS}_${n}` : n;
const $ = (id) => document.getElementById(id);

// ===== Gedeelde tijd (zie loper.html): klok corrigeren met de servertijd =====
let TIME_OFFSET = 0;
const tnow = () => Date.now() + TIME_OFFSET;
async function syncClock() {
  try {
    let lo = -Infinity, hi = Infinity;
    for (let i = 0; i < 6; i++) {
      const t0 = Date.now();
      const res = await fetch(location.pathname + '?_t=' + t0 + '_' + i, { method: 'HEAD', cache: 'no-store' });
      const t1 = Date.now(), d = res.headers.get('Date');
      if (!d) continue;
      const mid = (t0 + t1) / 2, srv = new Date(d).getTime();
      lo = Math.max(lo, srv - mid); hi = Math.min(hi, srv + 1000 - mid);
      await new Promise((r) => setTimeout(r, 170));
    }
    if (isFinite(lo) && isFinite(hi)) { const est = (lo + hi) / 2; if (Math.abs(est) < 10 * 60e3) TIME_OFFSET = est; }
  } catch (e) {}
}
syncClock(); setInterval(syncClock, 10 * 60e3);

// ===== Firebase met offline-opslag =====
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// ===== Medewerkers-pincode (eenmalig per toestel) =====
// Het toestel meldt zich aan bij Firebase met een gedeeld medewerkersaccount; het wachtwoord is de pincode + een vast achtervoegsel.
// Zet STAFF_LOGIN_REQUIRED op true zodra het account bestaat in Firebase (Authentication) en de beveiligingsregels zijn aangepast.
const STAFF_LOGIN_REQUIRED = false;
const STAFF_EMAIL = 'staff@24u-loop.humasol.app';
const STAFF_PW_SUFFIX = '-humasol-24u';
function staffGate(onReady) {
  if (!STAFF_LOGIN_REQUIRED || !firebase.auth) { onReady(); return; }
  const auth = firebase.auth(); let started = false;
  const go = () => { if (!started) { started = true; onReady(); } };
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff1cf;display:none;align-items:center;justify-content:center;padding:20px;font-family:"Bricolage Grotesque",system-ui,sans-serif';
  box.innerHTML = '<div style="background:#fff;border:4px solid #17120d;border-radius:20px;box-shadow:6px 6px 0 #17120d;padding:22px;width:100%;max-width:380px;text-align:center"><div style="font-size:24px;font-weight:800;margin-bottom:6px">Medewerkers</div><div style="font-weight:500;margin-bottom:14px">Voer de pincode in. Dit hoef je maar één keer te doen op dit toestel.</div><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="Pincode" style="font:inherit;font-size:28px;text-align:center;width:100%;border:3px solid #17120d;border-radius:12px;padding:12px;margin-bottom:10px;letter-spacing:.3em"><div id="pinErr" style="color:#dc2626;font-weight:700;min-height:22px;margin-bottom:6px"></div><button id="pinGo" style="font:inherit;font-weight:800;font-size:18px;width:100%;border:3px solid #17120d;border-radius:14px;background:#f2a342;padding:14px;box-shadow:3px 3px 0 #17120d">Ontgrendelen</button></div>';
  document.body.appendChild(box);
  const submit = async () => {
    const pin = box.querySelector('#pinIn').value.trim(); if (!pin) return;
    box.querySelector('#pinErr').textContent = '';
    try { await auth.signInWithEmailAndPassword(STAFF_EMAIL, pin + STAFF_PW_SUFFIX); }
    catch (e) { box.querySelector('#pinErr').textContent = (e.code === 'auth/too-many-requests') ? 'Te veel pogingen. Wacht even.' : (e.code === 'auth/network-request-failed') ? 'Geen internet. Probeer opnieuw.' : 'Onjuiste pincode.'; box.querySelector('#pinIn').value = ''; }
  };
  box.querySelector('#pinGo').onclick = submit; box.querySelector('#pinIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  auth.onAuthStateChanged((u) => { if (u) { box.style.display = 'none'; go(); } else { box.style.display = 'flex'; setTimeout(() => box.querySelector('#pinIn').focus(), 100); } });
}

let persistence = 'unknown';
db.enablePersistence({ synchronizeTabs: false }).then(() => { persistence = 'on'; }).catch((e) => { persistence = 'off:' + e.code; });
const FV = firebase.firestore.FieldValue;
const ref = (name, id) => id ? db.collection(col(name)).doc(id) : db.collection(col(name));

let runners = [], laps = [], queue = [], activeDocs = [], loaded = { runners: false, laps: false, queue: false, active: false };
let tab = params.get('tab') || 'chrono', lastAction = null, busyUntil = 0, pending = 0, lastCacheFalse = 0, offlineSince = 0, lastOK = 0;
try { lastAction = JSON.parse(localStorage.getItem('lastAction_' + NS) || 'null'); } catch (e) {}

// ===== helpers =====
const ICO = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I_TRASH = ICO('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v7M14 10v7"/>'), I_EDIT = ICO('<path d="M4 20l4-1 11-11-3-3L5 16l-1 4zM14 7l3 3"/>'), I_UP = ICO('<path d="M6 15l6-6 6 6"/>'), I_DOWN = ICO('<path d="M6 9l6 6 6-6"/>');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Verwachte rondetijd voor een loper zonder eerdere ronde, vast gekozen uit de data van vorig jaar (gemiddelde eerste ronde: mannen 1:34, vrouwen 1:54, overige 1:41).
// Wordt enkel intern gebruikt (piste, wachttijden); bij een eerste ronde tonen we geen verwachte tijd.
const FIRST_LAP_MS = { M: 94000, V: 114000, X: 101000 };
// Voorspelling van de volgende ronde: recente rondes tellen zwaarder (exponentieel gewogen), gestart vanaf de waarde van vorig jaar per geslacht.
// Op de data van vorig jaar 17% nauwkeuriger dan een gewoon gemiddelde (gemiddelde fout 4,1 s tegenover 5,0 s); een afzonderlijke trend-extrapolatie bleek niet beter.
const EW_FIRST = 0.7, EW_NEXT = 0.6;
// Na een lange rust (vanaf 1 u, volledig effect vanaf 4 u) loopt iemand weer 'fris': dan schuift de voorspelling voor de helft op naar het gemiddelde van de snelste helft van zijn rondes.
// Op de data van vorig jaar: na >2 u rust gemiddelde fout 4,1 s i.p.v. 4,6 s (weinig meetpunten: 58). Uur van de nacht en korte rust gaven geen duidelijke winst.
function predictNext(times, gender, restMs) {
  let e = FIRST_LAP_MS[gender] || FIRST_LAP_MS.X;
  times.forEach((x, i) => { const w = i === 0 ? EW_FIRST : EW_NEXT; e = e * (1 - w) + x * w; });
  if (restMs > 3600e3 && times.length >= 2) {
    const w = Math.min(1, (restMs - 3600e3) / (3 * 3600e3)) * 0.5, sorted = [...times].sort((a, b) => a - b), k = Math.max(1, Math.floor(sorted.length / 2));
    e = e * (1 - w) + (sorted.slice(0, k).reduce((a, b) => a + b, 0) / k) * w;
  }
  return e;
}

const mmss = (ms) => { const s = Math.ceil(ms / 1000);   /* zoals in de atletiek naar boven afronden, net als het grote scherm en de lopers-app */ return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const mmssc = (ms) => { const t = Math.max(0, ms); const s = Math.floor(t / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}.${String(Math.floor((t % 1000) / 10)).padStart(2, '0')}`; };
const clock = (d) => new Date(d).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
const sortedQueue = () => [...queue].sort((a, b) => new Date(a.addedAt) - new Date(b.addedAt));
const activeData = () => { const d = activeDocs.find((x) => x.id === 'current') || activeDocs[0]; return d ? d.data : null; };
const isRunning = () => { const a = activeData(); return !!(a && a.isRunning && a.runner); };
const startMs = () => { const a = activeData(); return a && a.startTime ? new Date(a.startTime).getTime() : null; };
const runItem = () => { if (!isRunning()) return null; const q = sortedQueue(); const rid = activeData().runner.runnerId; return q.find((x) => x.runnerId === rid) || null; };
const waiting = () => { const q = sortedQueue(), r = runItem(); return r ? q.filter((x) => x.id !== r.id) : q; };

// wachttijd-schatting (zelfde als het grote scherm)
let sc = null;
const stats = () => { if (sc && sc.n === laps.length && Date.now() - sc.at < 15000) return sc; const per = {}; laps.forEach((l) => { const e = per[l.runnerId] || (per[l.runnerId] = { n: 0, sum: 0 }); e.n++; e.sum += l.time; });
  const hourAgo = tnow() - 3600e3, rec = laps.filter((l) => new Date(l.timestamp).getTime() > hourAgo);
  const group = rec.length >= 5 ? rec.reduce((a, l) => a + l.time, 0) / rec.length : laps.length >= 5 ? laps.reduce((a, l) => a + l.time, 0) / laps.length : 100000;
  sc = { n: laps.length, at: Date.now(), per, group }; return sc; };
const expected = (rid) => { const rn = runners.find((x) => x.id === rid), mine = laps.filter((l) => l.runnerId === rid).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)), last = mine.length ? new Date(mine[mine.length - 1].timestamp).getTime() : tnow(); const at = (isRunning() && activeData().runner.runnerId === rid && startMs()) || tnow(); return predictNext(mine.map((l) => l.time), rn && rn.gender, at - last); };
const waitMs = (idx) => { let t = 0; if (isRunning()) { const st = startMs(); t = Math.max(5000, expected(activeData().runner.runnerId) - (st ? tnow() - st : 0)); } const w = waiting(); for (let j = 0; j < idx && j < w.length; j++) t += 2000 + expected(w[j].runnerId); return t; };
const waitText = (ms, i) => i === 0 && ms <= 5000 ? 'elk moment' : i === 0 && ms < 90000 ? `± ${Math.max(10, Math.round(ms / 10000) * 10)} s` : `± ${Math.max(1, Math.round(ms / 60000))} min`;

function toast(text, ms = 4000) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = text; $('toastBox').innerHTML = ''; $('toastBox').appendChild(el); setTimeout(() => { if (el.parentNode) el.remove(); }, ms); }
// Haptische feedback: trillen (Android/Chrome). Op een iPhone bestaat dat niet voor websites; daar gebruiken we de schakelaar van Safari (iOS 17.4+),
// die een tikje geeft als je er via een aanraking op "klikt". Dat werkt enkel op het moment van de aanraking zelf (aanraken, loslaten, tikken).

    $('overlay').innerHTML = `<div class="modal"><div class="box"><h3>${esc(title)}</h3><p>${esc(text)}</p>${input !== null ? `<input class="in" id="mIn" placeholder="${esc(input)}" autocomplete="off" autocapitalize="characters">` : ''}
      <div class="row2" style="margin-top:12px"><button class="btn" id="mNo">${esc(cancel)}</button><button class="btn ${danger ? 'danger' : 'primary'}" id="mYes">${esc(ok)}</button></div></div></div>`;

const lockButtons = (ms = 1500) => { busyUntil = Date.now() + ms; render(); setTimeout(render, ms + 30); };

async function resetAll() {

  const names = ['laps', 'runners', 'queue', 'activeRunner'].concat(NS ? ['replay'] : []);

// ===== Samenvatting voor de lopers-app: de chronometer schrijft elke ~2 min een kleine samenvatting, zodat gsm's niet alle rondes hoeven te lezen =====
function buildMeta(runnersArr, lapsArr) {
  const by = {};
  lapsArr.forEach((l) => { const e = by[l.runnerId] || (by[l.runnerId] = { n: 0, tt: 0, best: Infinity, sq: 0 }); e.n++; e.tt += l.time; if (l.time < e.best) e.best = l.time; });
  lapsArr.forEach((l) => { const e = by[l.runnerId], m = e.tt / e.n; e.sq += (l.time - m) * (l.time - m); });
  const seqs = {}, lastAt = {}; [...lapsArr].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)).forEach((l) => { (seqs[l.runnerId] = seqs[l.runnerId] || []).push(l.time); lastAt[l.runnerId] = new Date(l.timestamp).getTime(); });
  const list = runnersArr.map((r) => { const e = by[r.id]; return { i: r.id, n: r.name || '', g: r.gender || 'X', l: e ? e.n : 0, t: e ? Math.round(e.tt) : 0, b: e ? Math.round(e.best) : 0, s: e && e.n >= 3 ? +(Math.sqrt(e.sq / e.n) / (e.tt / e.n)).toFixed(3) : 0, e: e ? Math.round(predictNext(seqs[r.id] || [], r.gender, Date.now() - (lastAt[r.id] || Date.now()))) : 0 }; });
  const gOf = {}; runnersArr.forEach((r) => { gOf[r.id] = r.gender; });
  const sorted = [...lapsArr].sort((a, b) => a.time - b.time);
  const top = (arr) => arr.slice(0, 10).map((l) => ({ id: l.runnerId, name: l.runnerName, t: l.time, at: l.timestamp }));
  const most = list.filter((x) => x.l > 0).sort((a, b) => b.l - a.l).slice(0, 10).map((x) => ({ id: x.i, name: x.n, n: x.l }));
  const now = Date.now();
  return {
    index: { updatedAt: now, list },
    summary: { updatedAt: now, total: lapsArr.length, record: sorted[0] ? { t: sorted[0].time, name: sorted[0].runnerName } : null,
      top: { fast: top(sorted), fastM: top(sorted.filter((l) => gOf[l.runnerId] === 'M')), fastV: top(sorted.filter((l) => gOf[l.runnerId] === 'V')), most } }
  };
}

let metaLast = '', metaTimer = null, metaAt = 0;

// korte info over een loper (voor wie nu loopt of als volgende komt)
function runnerFacts(rid) {
  const mine = laps.filter((l) => l.runnerId === rid).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  if (!mine.length) return '<div class="facts"><span>Eerste rondje</span></div>';
  const best = Math.min(...mine.map((l) => l.time)), last = mine[mine.length - 1].time;
  return `<div class="facts"><span><small>Schatting</small>± ${mmss(expected(rid))}</span><span><small>Laatste</small>${mmss(last)}</span><span><small>Snelste</small>${mmss(best)}</span></div>`;
}
let moreOpen = false;   // 'Andere acties' open of dicht
function viewChrono() {
  if (!loaded.queue || !loaded.active) return `<div class="card now" style="background:#fff"><div class="nm" style="color:var(--muted)">Laden…</div><div class="sub">Even geduld, de wachtrij wordt opgehaald</div></div><button class="big wait" disabled>EVEN GEDULD</button>`;
  const a = activeData(), running = isRunning(), w = waiting(), st = startMs(), busy = locked();
  let top = '', button = '';
  if (running) {
    const run = a.runner, ex = expected(run.runnerId);
    top = `<div class="card now"><div class="k"><span class="dot"></span>Nu aan het lopen</div><div class="nm" style="margin-top:6px">${esc(run.runnerName)}</div><div class="clk" data-live="${st || ''}">${mmssc(st ? tnow() - st : 0)}</div>${runnerFacts(run.runnerId)}</div>`;
    const hint = holdMode ? '<span class="hint">houd ingedrukt</span>' : '';
    button = w.length ? `<button class="big hold" data-hold="main" ${busy ? 'disabled' : ''}>RONDE KLAAR<small>daarna loopt: ${esc(w[0].runnerName)}</small>${hint}</button>` : `<button class="big hold stop" data-hold="main" ${busy ? 'disabled' : ''}>RONDE KLAAR<small>niemand meer in de rij: de timer stopt</small>${hint}</button>`;
  } else {
    top = `<div class="card now" style="background:#fff"><div class="k" style="color:var(--muted)">Klaar om te starten</div><div class="nm" style="margin-top:6px">${w.length ? esc(w[0].runnerName) : '—'}</div>${w.length ? runnerFacts(w[0].runnerId) : '<div class="sub">Wachtrij is leeg</div>'}</div>`;
    button = `<button class="big hold ${w.length ? '' : 'wait'}" data-hold="main" ${(!w.length || busy) ? 'disabled' : ''}>START<small>${w.length ? esc(w[0].runnerName) : 'wacht op een loper'}</small>${holdMode && w.length ? '<span class="hint">houd ingedrukt</span>' : ''}</button>`;
  }
  const recentLaps = [...laps].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 5).map((l) => `<div class="row"><div class="no" style="width:46px;font-size:13px">${clock(l.timestamp)}</div><div class="nm">${esc(l.runnerName)}</div><div class="w">${mmssc(l.time)}</div></div>`).join('');
  const recentAdj = lastAction && Date.now() - lastAction.at < 90000;
  const undoCard = lastAction ? `<div class="undo" style="flex-wrap:wrap"><b>Laatste: ${esc(lastAction.lapData.runnerName)} ${mmssc(lastAction.time)}</b><button class="btn small danger" data-act="undo">Ongedaan</button>
    ${recentAdj ? `<div class="corr" style="width:100%"><b>Te laat gedrukt?</b><button class="btn small" data-adj="5000">−5 s</button><button class="btn small" data-adj="10000">−10 s</button><button class="btn small" data-adj="20000">−20 s</button></div>` : ''}</div>` : '';
  const next = w.slice(1, 6).map((q, i) => { const idx = i + 1; /* de eerste staat al in 'Hierna' (of bovenaan als niemand loopt) */ return `<div class="row"><div class="no">${idx + 1}</div><div class="nm">${esc(q.runnerName)}</div><div class="w">${waitText(waitMs(idx), idx)}<small>rond ${clock(tnow() + waitMs(idx))}</small></div></div>`; }).join('');
  const nextCard = running && w.length ? `<div class="card nextc"><div class="lbl">Hierna</div><div class="nm2">${esc(w[0].runnerName)}</div>${runnerFacts(w[0].runnerId)}</div>` : '';
  const actions = running ? `<button class="btn" data-act="moreacts" style="width:100%">${moreOpen ? 'Andere acties ▴' : 'Andere acties ▾'}</button>
    ${moreOpen ? `<div class="row2"><button class="btn" data-act="manual">Tijd intikken</button><button class="btn" data-act="stop">Stoppen na deze</button></div><div class="row2"><button class="btn" data-act="swap">Andere loper loopt</button><button class="btn" data-act="skip" ${w.length ? '' : 'disabled'}>Volgende niet aanwezig</button></div><button class="btn danger" data-act="cancel">Loop annuleren (niet opslaan)</button>` : ''}`
    : (w.length ? '<button class="btn" data-act="skip">Niet aanwezig: naar het einde van de rij</button>' : '');
  return `${top}${button}${undoCard}${nextCard}${actions}
    <div class="card"><h2>Daarna <small>${w.length} wachtend</small></h2>${next || '<div class="empty">Niemand</div>'}</div>
    <div class="card"><h2>Laatste rondes <small>${laps.length} in totaal</small></h2>${recentLaps || '<div class="empty">Nog geen rondes</div>'}</div>`;
}
function viewQueue() {
  const w = waiting(), r = runItem(), a = activeData();
  return `<div class="card"><h2>Wachtrij <small>${w.length} wachtend</small></h2>
    ${isRunning() ? `<div class="row run"><div class="no">&gt;</div><div class="nm">${esc(a.runner.runnerName)}<small>loopt nu</small></div><div class="w" data-live="${startMs() || ''}">${mmssc(startMs() ? tnow() - startMs() : 0)}</div></div>` : ''}
    ${w.length === 0 ? '<div class="empty">Geen lopers in de wachtrij</div>' : w.map((q, i) => `<div class="row"><div class="no">${i + 1}</div><div class="nm">${esc(q.runnerName)}<small>${waitText(waitMs(i), i)} · rond ${clock(tnow() + waitMs(i))}</small></div>
      <button class="ib" aria-label="Omhoog" data-act="up" data-id="${esc(q.id)}" ${i === 0 ? 'disabled' : ''}>${I_UP}</button><button class="ib" aria-label="Omlaag" data-act="down" data-id="${esc(q.id)}" ${i === w.length - 1 ? 'disabled' : ''}>${I_DOWN}</button><button class="ib red" aria-label="Verwijderen" data-act="rm" data-id="${esc(q.id)}">${I_TRASH}</button></div>`).join('')}</div>`;
}
function viewLaps() {
  const list = [...laps].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 40);
  return `<div class="card"><h2>Laatste rondes <small>${laps.length} in totaal</small></h2>
    ${list.length === 0 ? '<div class="empty">Nog geen rondes</div>' : list.map((l) => `<div class="lrow"><div class="main"><b>${esc(l.runnerName)}</b><span class="t">${mmssc(l.time)}</span> <small>${clock(l.timestamp)} · ronde ${l.lapNumber || '?'}</small></div>
      <button class="ib" aria-label="Tijd aanpassen" data-act="edit" data-id="${esc(l.id)}">${I_EDIT}</button><button class="ib red" aria-label="Verwijderen" data-act="del" data-id="${esc(l.id)}">${I_TRASH}</button></div>`).join('')}</div>`;
}
function viewMore() {
  return `<div class="card"><h2>Dit toestel</h2>
    <div class="row"><div class="nm">Scherm wakker houden<small>${wlOK ? 'actief: het scherm gaat niet uit' : 'niet actief: tik hieronder'}</small></div><button class="btn small ${wlOK ? 'ok' : 'primary'}" data-act="awake">${wlOK ? 'Aan' : 'Zet aan'}</button></div>
    <div class="row"><div class="nm">Ronde klaar<small>${holdMode ? 'ingedrukt houden (veilig tegen aanrakingen)' : 'één tik (sneller, maar gevoeliger)'}</small></div><button class="btn small ${holdMode ? 'ok' : ''}" data-act="holdmode">${holdMode ? 'Veilig' : 'Snel'}</button></div>
    <div class="row"><div class="nm">Haptiek<small>${canVibrate ? 'trillen wordt ondersteund' : 'iPhone: via de schakelaar-truc (iOS 17.4+); zet Instellingen → Geluid en haptiek → Systeemhaptiek aan'}</small></div><button class="btn small primary" data-act="hapTest">Test</button></div>
    <div class="row"><div class="nm">Batterij<small>${batt ? `${Math.round(batt.level * 100)}%${batt.charging ? ' · aan de lader' : ' · niet aan de lader'}` : 'kan niet worden uitgelezen op dit toestel (iPhone): zet de gsm aan de lader'}</small></div></div>
    <div class="row"><div class="nm">Gedeelde tijd<small>klok van dit toestel ${TIME_OFFSET >= 0 ? '+' : '−'}${(Math.abs(TIME_OFFSET) / 1000).toFixed(2).replace('.', ',')} s gecorrigeerd</small></div></div>
    <div class="row"><div class="nm">Offline-opslag<small>${persistence === 'on' ? 'aan: rondes gaan niet verloren zonder internet' : persistence.startsWith('off') ? 'niet beschikbaar in deze browser: sluit/herlaad niet' : 'bezig…'}</small></div></div></div>
    <div class="card"><h2>Gegevens</h2><div class="row2"><button class="btn" data-act="csvLaps">Rondes (CSV)</button><button class="btn" data-act="csvRunners">Lopers (CSV)</button></div></div>
    <div class="card"><h2>Medewerkers</h2><div class="row"><div class="nm">Pincode<small>${STAFF_LOGIN_REQUIRED ? (firebase.auth().currentUser ? 'ontgrendeld op dit toestel' : 'niet ontgrendeld') : 'staat uit (alles is open)'}</small></div>${STAFF_LOGIN_REQUIRED && firebase.auth().currentUser ? '<button class="btn small" data-act="logout">Vergrendel</button>' : ''}</div></div>
    <div class="card"><h2>Gevaarlijke zone</h2><div class="sec" style="margin-bottom:8px">${NS ? `Wist enkel de oefenomgeving "${esc(NS)}"` : 'Wist het ECHTE event'}</div><button class="btn danger" style="width:100%" data-act="reset">Alle data wissen…</button></div>
    <div class="empty" style="font-size:12px">Chronometer · Humasol vzw</div>`;
}
let lastSig = '';
function render() {
  renderChrome();
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (typing || holdState) return;
  $('view').innerHTML = tab === 'queue' ? viewQueue() : tab === 'laps' ? viewLaps() : tab === 'more' ? viewMore() : viewChrono();
}
// ===== ingedrukt houden =====
const HOLD_MS = 450;
let holdState = null;
function holdCancel(vib) { if (!holdState) return; cancelAnimationFrame(holdState.raf); const el = holdState.el; if (el) el.style.setProperty('--p', 0); const done = holdState.done; holdState = null; if (!done && vib) buzz('tick'); setTimeout(render, 30); }
document.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-hold]'); if (!el || el.disabled || locked() || holdState) return;
  const t0 = tnow(), ms = holdMode ? HOLD_MS : 0;
  holdState = { t0, el, done: false, start: performance.now(), raf: 0 };
  buzz('hold');
  if (!ms) { holdState.done = true; const st = holdState; holdState = null; pressMain({ t0: st.t0 }); return; }
  const step = (now) => {
    if (!holdState) return;
    const p = Math.min(1, (now - holdState.start) / ms); el.style.setProperty('--p', p);
    if (p >= 1) { holdState.done = true; lastDone = Date.now(); const st = holdState; holdState = null; el.style.setProperty('--p', 0); pressMain({ t0: st.t0 }); return; }
    holdState.raf = requestAnimationFrame(step);
  };
  holdState.raf = requestAnimationFrame(step);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => document.addEventListener(ev, (e) => { if (holdState && !holdState.done) holdCancel(true); else if (ev === 'pointerup' && e.target.closest && e.target.closest('[data-hold]') && Date.now() - lastDone < 1500) buzz('lap'); }, true));
let lastDone = 0;
document.addEventListener('contextmenu', (e) => { if (e.target.closest('[data-hold]')) e.preventDefault(); });

// ===== batterij en levensteken =====
let batt = null, nagUntil = 0;
(async () => { try { if (navigator.getBattery) { batt = await navigator.getBattery(); const upd = () => { if (batt.level <= 0.2 && !batt.charging) buzz('warn'); render(); }; batt.addEventListener('levelchange', upd); batt.addEventListener('chargingchange', render); render(); } } catch (e) {} })();
setInterval(() => { if (!batt) { nagUntil = Date.now() + 60000; buzz('warn'); render(); } }, 90 * 60e3);   // geen batterij-uitlezing (iPhone): elk anderhalf uur een herinnering
setInterval(() => {   // laat de wachtrij-laptop weten dat de chronometer actief is
  db.collection(col('meta')).doc('chrono').set({ t: tnow(), battery: batt ? Math.round(batt.level * 100) : null, charging: batt ? !!batt.charging : null, pending }, { merge: true }).catch(() => {});
}, 15000);

document.addEventListener('click', (e) => {
  const adj = e.target.closest('[data-adj]'); if (adj) { adjustLast(Number(adj.dataset.adj)); return; }
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const a = t.dataset.act, id = t.dataset.id;
  if (a === 'moreacts') { moreOpen = !moreOpen; render(); return; }
  if (['manual', 'stop', 'swap', 'skip', 'cancel'].includes(a)) moreOpen = false;
  ({ main: pressMain, undo, manual: manualTime, stop: stopAfterThis, cancel: cancelRun, awake: () => { keepAwake().then(render); }, csvLaps: () => exportCsv('laps'), csvRunners: () => exportCsv('runners'), reset: resetAll, hapTest: () => { const m = buzz('lap'); toast('Test: ' + (m === 'vibrate' ? 'trillen' : m === 'switch' ? 'schakelaar-haptiek' : 'niet beschikbaar') + ' (voel je iets?)', 4000); }, swap: swapActive, skip: skipNext, holdmode: () => { holdMode = !holdMode; try { localStorage.setItem('holdMode', holdMode ? 'on' : 'off'); } catch (e) {} buzz('tick'); render(); }, logout: () => { firebase.auth().signOut().then(() => location.reload()); },
     up: () => moveQueued(id, -1), down: () => moveQueued(id, 1), rm: () => removeQueued(id), del: () => deleteLap(id), edit: () => editLap(id) })[a]?.();
});

// ===== data =====
function startData() {
const listen = (name, fn) => db.collection(col(name)).onSnapshot({ includeMetadataChanges: true }, (s) => {
  if (s.metadata.fromCache) { if (!offlineSince) offlineSince = Date.now(); lastCacheFalse = Date.now(); } else { offlineSince = 0; lastOK = Date.now(); }
  if (s.docChanges().length || !loaded[name === 'activeRunner' ? 'active' : name]) { fn(s); loaded[name === 'activeRunner' ? 'active' : name] = true; sc = null; render(); scheduleMeta(); }
}, (err) => { $('chipTxt').textContent = 'Fout: ' + err.code; });
listen('runners', (s) => { runners = s.docs.map((d) => ({ id: d.id, ...d.data() })); });
listen('laps', (s) => { laps = s.docs.map((d) => ({ id: d.id, ...d.data() })); });
listen('queue', (s) => { queue = s.docs.map((d) => ({ id: d.id, ...d.data() })); });
listen('activeRunner', (s) => { activeDocs = s.docs.map((d) => ({ id: d.id, data: d.data() })); });
}
staffGate(startData);

setInterval(() => {
  document.querySelectorAll('[data-live]').forEach((el) => { const st = Number(el.dataset.live); if (st) el.textContent = mmssc(tnow() - st); });
}, 50);
setInterval(render, 5000);
window.addEventListener('online', render); window.addEventListener('offline', render);
render();
</script>
