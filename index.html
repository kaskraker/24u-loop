    <script>
        const { useState, useEffect, useRef, createElement: h } = React;


	// PRODUCTIE CONFIG 2026 (u-loop-leuven-2026)
	const firebaseConfig = {
		apiKey: "AIzaSyDVULWNjHaR41EaptoQYnWnTdnU-suMuuA",
		authDomain: "u-loop-leuven-2026.firebaseapp.com",
		projectId: "u-loop-leuven-2026",

		messagingSenderId: "1032849674125",
		appId: "1:1032849674125:web:110054a3b61ba10eedb7c4",

	};

	// TESTING CONFIG (voor testen, niet voor het echte event)
	// const firebaseConfig = {
	//   apiKey: "AIzaSyA8VH8NT5H-f35eCUZptgUK3wYVOn7jfRk",
	//   authDomain: "u-loop-testing.firebaseapp.com",

	//   appId: "1:978708881869:web:8271d58611f3a64bae6484",

	// };

	// EDITIE 2025 (u-loop-leuven) - oude data, niet gebruiken voor 2026
	// projectId: "u-loop-leuven"

        // Simulatiemodus: ?sim=1 gebruikt dummydata in het geheugen en raakt Firebase NIET aan
        const SIM_MODE = new URLSearchParams(window.location.search).get('sim') === '1';

        // ===== Offline-first: schrijven blokkeert nooit, status altijd zichtbaar =====
        // Namespace voor oefenen: ?ns=oefen gebruikt aparte collecties (oefen_runners, ...) in dezelfde database.
        const NS = (new URLSearchParams(window.location.search).get('ns') || '').replace(/[^a-zA-Z0-9_]/g, '');
        // Het event: dinsdag 20 oktober 2026, 20:00 tot woensdag 20:00 (zelfde als loper.html).
        // In de oefenmodus (?ns=) en de simulatie (?sim=1) start het om 20:00 op of vóór de eerste ronde; zonder rondes: de laatste 20:00.
        const EVENT_START_REAL = Date.parse('2026-10-20T20:00:00+02:00');
        const eventStartFor = (laps) => {
            if (!NS && !SIM_MODE) return EVENT_START_REAL;
            let first = Infinity; laps.forEach(l => { const t = new Date(l.timestamp).getTime(); if (t < first) first = t; });
            const d = new Date(isFinite(first) ? first : Date.now()); d.setHours(20, 0, 0, 0);
            if (d.getTime() > (isFinite(first) ? first : Date.now())) d.setDate(d.getDate() - 1);
            return d.getTime();
        };
        const colName = (name) => NS ? `${NS}_${name}` : name;
        // ?autoplay=1 (enkel in oefenmodus): dit venster speelt de rest van het event van vorig jaar live af in Firestore
        const AUTOPLAY = !!NS && new URLSearchParams(window.location.search).get('autoplay') === '1';

        const syncState = {
            pending: 0, pendingSince: 0, failed: 0, lastError: null, listenError: null,
            fromCache: {}, hasPending: {}, everOnline: false, lastServer: 0,
            persistence: 'unknown', settled: false, staleSince: 0, lastConn: null, offlineSince: null, offlineWrites: 0,
            recoverFlag: false, recoverCount: 0, recovered: null,
            loadedAt: Date.now(), listeners: new Set()
        };
        const notifySync = () => syncState.listeners.forEach(fn => { try { fn(); } catch (e) {} });

        // Is dit toestel nu echt verbonden met de server? (browser online + alle luisteraars bevestigd door de server)
        const computeConnection = () => {
            const flags = Object.values(syncState.fromCache);
            if (!navigator.onLine) return 'offline';
            if (flags.length === 0) return 'connecting';
            if (flags.every(v => v === false)) { syncState.settled = true; syncState.staleSince = 0; return 'online'; }
            // gemengd (sommige luisteraars nog uit cache): bij het opstarten is dat gewoon "verbinden"
            if (!syncState.settled && Date.now() - syncState.loadedAt < 12000) return 'connecting';
            // pas "offline" als het 10 s aanhoudt: korte haperingen van de verbinding negeren we
            if (!syncState.staleSince) syncState.staleSince = Date.now();
            return Date.now() - syncState.staleSince > 10000 ? 'offline' : 'online';
        };
        const trackConnection = () => {
            const conn = computeConnection();
            if (conn !== syncState.lastConn) {
                if (conn === 'offline') syncState.offlineSince = Date.now();
                if (syncState.lastConn === 'offline' && conn === 'online') {
                    syncState.recoverFlag = true; syncState.recoverCount = syncState.offlineWrites; syncState.offlineWrites = 0;
                }
                if (conn === 'online') syncState.offlineSince = null;
                syncState.lastConn = conn;
            }
            if (conn === 'online' && syncState.pending === 0 && syncState.recoverFlag) {
                syncState.recovered = { at: Date.now(), count: syncState.recoverCount };
                syncState.recoverFlag = false;
            }
            return conn;
        };
        const trackWrite = (promise) => {
            if (syncState.pending === 0) syncState.pendingSince = Date.now();
            syncState.pending++;
            if (computeConnection() === 'offline') syncState.offlineWrites++;
            notifySync();
            promise.then(() => {
                syncState.pending = Math.max(0, syncState.pending - 1);
                notifySync();
            }, (err) => {
                syncState.pending = Math.max(0, syncState.pending - 1);
                syncState.failed++; syncState.lastError = err;
                console.error('Schrijfactie geweigerd:', err);
                notifySync();
            });
        };
        const computeSync = () => {
            if (!isFirebaseConfigured) return { state: 'demo' };
            const conn = trackConnection();
            let state = conn;
            if (conn === 'online') {
                if (syncState.failed > 0 || syncState.listenError) state = 'error';
                else if (syncState.pending > 0 && Date.now() - syncState.pendingSince > 2500) state = 'syncing';
            }
            const err = syncState.lastError ? (syncState.lastError.message || String(syncState.lastError)) : syncState.listenError;
            return {
                state, conn, pending: syncState.pending, failed: syncState.failed, error: err,
                lastServer: syncState.lastServer, offlineSince: syncState.offlineSince, persistence: syncState.persistence,
                recovered: syncState.recovered && Date.now() - syncState.recovered.at < 10000 ? syncState.recovered : null
            };
        };
        const useSyncStatus = () => {
            const [, force] = useState(0);
            useEffect(() => {
                const f = () => force(n => n + 1);
                syncState.listeners.add(f);
                const id = setInterval(f, 1000);
                window.addEventListener('online', f);
                window.addEventListener('offline', f);
                return () => {
                    syncState.listeners.delete(f); clearInterval(id);
                    window.removeEventListener('online', f); window.removeEventListener('offline', f);
                };
            }, []);
            return computeSync();
        };

        // Echte Firestore: schrijven past meteen lokaal toe en blokkeert niet op de server (offline-first)
        const realCollection = (name) => {
            const coll = () => db.collection(colName(name));
            return {
                onSnapshot: (cb, errCb) => {
                    let first = true;
                    return coll().onSnapshot({ includeMetadataChanges: true }, (snap) => {
                        syncState.fromCache[name] = snap.metadata.fromCache;
                        syncState.hasPending[name] = snap.metadata.hasPendingWrites;
                        if (!snap.metadata.fromCache) { syncState.everOnline = true; syncState.lastServer = Date.now(); syncState.listenError = null; }
                        notifySync();
                        if (first || snap.docChanges().length > 0) { first = false; cb(snap); }
                    }, (err) => {
                        console.error('Firestore luisteraar-fout:', name, err);
                        syncState.listenError = err.message || String(err);
                        notifySync();
                        if (errCb) errCb(err);
                    });
                },
                // Veel documenten tegelijk schrijven (batches van 400): veel sneller dan één voor één
                deleteMany: (ids) => {
                    for (let i = 0; i < ids.length; i += 400) {
                        const batch = db.batch();
                        ids.slice(i, i + 400).forEach(id => batch.delete(coll().doc(id)));
                        trackWrite(batch.commit());
                    }
                    return Promise.resolve();
                },
                // Meerdere documenten in één keer bijwerken: de lijst springt dan niet via tussenstanden
                updateMany: (entries) => {
                    for (let i = 0; i < entries.length; i += 400) {
                        const batch = db.batch();
                        entries.slice(i, i + 400).forEach(e => batch.update(coll().doc(e.id), e.data));
                        trackWrite(batch.commit());
                    }
                    return Promise.resolve();
                },
                // Schrijft in pakjes van 400. Geeft een belofte terug die pas klaar is als ALLE pakjes door de server bevestigd zijn:
                // wie 'await' gebruikt (bv. de import), weet zo zeker dat alles weg is voor hij het venster verlaat. Wie niet wacht, schrijft gewoon offline-first.
                setMany: (entries) => {
                    const commits = [];
                    for (let i = 0; i < entries.length; i += 400) {
                        const batch = db.batch();
                        entries.slice(i, i + 400).forEach(e => e.merge ? batch.set(coll().doc(e.id), e.data, { merge: true }) : batch.set(coll().doc(e.id), e.data));
                        const c = batch.commit(); trackWrite(c); commits.push(c);
                    }
                    return Promise.all(commits);
                },
                add: (data) => {
                    const ref = coll().doc();            // id bestaat meteen, zonder server
                    trackWrite(ref.set(data));
                    return Promise.resolve({ id: ref.id });
                },
                doc: (id) => ({
                    set: (data) => { trackWrite(coll().doc(id).set(data)); return Promise.resolve(); },
                    update: (data) => { trackWrite(coll().doc(id).update(data)); return Promise.resolve(); },
                    delete: () => { trackWrite(coll().doc(id).delete()); return Promise.resolve(); }
                })
            };
        };

        // Initialize Firebase
        let db;
        let isFirebaseConfigured = false;
        
        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY" && !SIM_MODE) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                isFirebaseConfigured = true;
                try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) { console.warn('Firestore-instellingen:', e.message); }
                // Offline-opslag: lokaal bewaren (ook na herladen) en later automatisch synchroniseren
                // Elk venster heeft zijn eigen verbinding: geen gedeeld "hoofdvenster" dat op de achtergrond kan vertragen.
                // Het eerste venster bewaart offline-data; het grote scherm (enkel lezen) heeft geen offline-opslag nodig.
                if (new URLSearchParams(window.location.search).get('mode') === 'display') {
                    syncState.persistence = 'off:display';
                } else {
                    db.enablePersistence({ synchronizeTabs: false })
                        .then(() => { syncState.persistence = 'on'; notifySync(); })
                        .catch((err) => { syncState.persistence = 'off:' + err.code; console.warn('Offline-opslag niet beschikbaar in dit venster:', err.code); notifySync(); });
                }
                console.log("Firebase verbonden!");
            } else {
                console.warn("Demo modus - configureer Firebase voor multi-device sync");
            }
        } catch (error) {
            console.error("Firebase init error:", error);
        }

        // Demo storage (fallback als Firebase niet geconfigureerd is)
        const demoStorage = {
            runners: [],
            laps: [],
            queue: [],
            activeRunner: [],
            listeners: []
        };


        // ===== Simulatie (?sim=1): speelt het 24u-event van vorig jaar opnieuw af, met dummynamen =====
        // Echte rondetijden en volgorde van 2025, anoniem (enkel loper-nummers). Het event loopt van
        // gisteren 20:00 tot vandaag 20:00; rondes komen automatisch binnen op het juiste moment.
        // Optioneel: &seed=7 geeft andere dummynamen.

            if (word !== word.toLowerCase() && word !== word.toUpperCase()) return word;

            if (a === b) return 0;
            const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

            const [editingLapId, setEditingLapId] = useState(null);
            const [editingLapTime, setEditingLapTime] = useState('');
            const [showAllAdminLaps, setShowAllAdminLaps] = useState(false);
            const [showAllLapsAdmin, setShowAllLapsAdmin] = useState(false);
            const [adminLapSearchQuery, setAdminLapSearchQuery] = useState('');
            const [showAddLapForm, setShowAddLapForm] = useState(false);
            const [newLapRunnerId, setNewLapRunnerId] = useState('');
            const [newLapTime, setNewLapTime] = useState('');
            const [newLapTimestamp, setNewLapTimestamp] = useState(() => {
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                return now.toISOString().slice(0, 16);
            });
            const [showLowQueueWarning, setShowLowQueueWarning] = useState(false);
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [connectionError, setConnectionError] = useState(null);
            const [lastSyncTime, setLastSyncTime] = useState(Date.now());
            const [lastAction, setLastAction] = useState(null); // Full state snapshot for rollback
            const [isProcessingNext, setIsProcessingNext] = useState(false); // Debounce flag
            const ignoreFirebaseUpdatesRef = useRef(false); // Prevent flicker during transitions (use ref for listener access)
            const [myRunnerId, setMyRunnerId] = useState(() => {
                try { return localStorage.getItem('myRunnerId') || ''; } catch (e) { return ''; }
            });
            const [myRunnerQuery, setMyRunnerQuery] = useState('');
            const rankTrackRef = useRef({ t0: Date.now(), lists: {} }); // Positiewijzigingen in ranglijsten
            const darkMode = false, setDarkMode = () => {};   // donkere modus is bewust verwijderd
            try { localStorage.removeItem('darkMode'); document.body.classList.remove('dark-mode'); } catch (e) {}
            const [draggedIndex, setDraggedIndex] = useState(null); // For drag & drop queue reordering
            const [dragOverIndex, setDragOverIndex] = useState(null); // Visual feedback during drag
            const [collapsedLeaderboards, setCollapsedLeaderboards] = useState({
                fastestOverall: false,
                fastestWomen: false,
                fastestMen: false,
                mostLapsOverall: false,
                mostLapsMen: false,
                mostLapsWomen: false,
                bestAverage: false
            });
            const [weather, setWeather] = useState(null);

            // Fetch weather data for Leuven (using Open-Meteo - free, no API key needed)
            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        // Leuven coordinates: 50.8798°N, 4.7005°E
                        const response = await fetch(
                            'https://api.open-meteo.com/v1/forecast?latitude=50.8798&longitude=4.7005&timezone=Europe/Brussels'
                            + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day'
                            + '&hourly=temperature_2m,weather_code,precipitation_probability,is_day&forecast_hours=8'
                            + '&minutely_15=precipitation&forecast_minutely_15=9'
                        );
                        const data = await response.json();
                        const c = data.current, H = data.hourly || {}, M = data.minutely_15 || {}, now = Date.now();
                        setWeather({
                            temp: Math.round(c.temperature_2m),
                            code: c.weather_code,
                            day: c.is_day !== 0,
                            feels: Math.round(c.apparent_temperature),
                            wind: Math.round(c.wind_speed_10m),
                            // komende 6 volle uren (de tijden van Open-Meteo zijn lokale tijd in Brussel)
                            hours: (H.time || []).map((t, i) => ({ t: new Date(t).getTime(), temp: Math.round(H.temperature_2m[i]), code: H.weather_code[i], pp: H.precipitation_probability[i], day: H.is_day[i] !== 0 })).filter(x => x.t > now).slice(0, 6),
                            q15: (M.time || []).map((t, i) => ({ t: new Date(t).getTime(), mm: M.precipitation[i] || 0 }))
                        });
                    } catch (error) {
                        console.error('Weather fetch failed:', error);
                    }
                };

                fetchWeather(); // Initial fetch
                const interval = setInterval(fetchWeather, 10 * 60 * 1000); // Update every 10 minutes
                return () => clearInterval(interval);
            }, []);

            // Firebase listeners
            useEffect(() => {
                // Kijkers (groot scherm, publiek): bundel updates die kort na elkaar binnenkomen (ronde, loper, wachtrij, actieve loper)
                // tot één weergave-update, zodat een wissel van loper in één vloeiende beweging gebeurt in plaats van in stukjes.
                const VIEWER = IS_DISPLAY_ONLY || URL_MODE === 'public';
                // Rondes/lopers/wachtrij worden vastgehouden tot de nieuwe actieve loper (de timer) binnen is, en dan samen getoond.
                // Komt die niet (bv. laatste loper, handmatige correctie), dan na 1,2 s toch.
                const pend = []; let flushT = null;
                const flushNow = () => { clearTimeout(flushT); flushT = null; pend.splice(0).forEach(f => f()); };
                const later = (fn, flushAll) => {
                    if (!VIEWER) { fn(); return; }
                    pend.push(fn);
                    if (flushAll) { flushNow(); return; }
                    if (!flushT) flushT = setTimeout(flushNow, 1200);
                };
                let lastActiveKey = '__init__';
                const unsubRunners = firestoreWrapper.collection('runners').onSnapshot(snapshot => {
                    const v = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    later(() => setRunners(v));
                });

                const unsubLaps = firestoreWrapper.collection('laps').onSnapshot(snapshot => {
                    const v = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    later(() => setLaps(v));
                });

                const unsubQueue = firestoreWrapper.collection('queue').onSnapshot(snapshot => {
                    const sorted = snapshot.docs
                        .map(doc => ({ id: doc.id, ...doc.data() }))
                        .sort((a, b) => new Date(a.addedAt) - new Date(b.addedAt));
                    later(() => { setQueue(sorted); setQueueLoaded(true); });
                });

                // Listen to active runner from Firebase
                let emptyTimer = null;
                const unsubActiveRunner = firestoreWrapper.collection('activeRunner').onSnapshot(snapshot => {
                    activeDocIdsRef.current = snapshot.docs.map(d => d.id);
                    clearTimeout(emptyTimer);
                    // Skip Firebase updates during local transitions to prevent flicker
                    if (ignoreFirebaseUpdatesRef.current) {
                        console.log('⏭️ Firebase update genegeerd (tijdens transitie)');
                        return;
                    }
                    
                    if (snapshot.docs.length > 0) {
                        const data = (snapshot.docs.find(d => d.id === 'current') || snapshot.docs[0]).data();
                        const startTimeMs = data.startTime ? new Date(data.startTime).getTime() : null;
                        
                        console.log('Firebase update ontvangen:', {
                            runner: data.runner,
                            isRunning: data.isRunning,
                            startTime: data.startTime,
                            startTimeMs: startTimeMs,
                            currentTime: Date.now(),
                            timeDiff: startTimeMs ? Date.now() - startTimeMs : 0
                        });
                        
                        const key = `${data.runner && data.runner.runnerId}_${data.startTime}_${data.isRunning}`;
                        const changed = key !== lastActiveKey; lastActiveKey = key;
                        later(() => { setActiveRunner(data.runner); setIsRunning(data.isRunning); setStartTime(startTimeMs); }, changed);
                    } else {
                        // even wachten: bij een wissel van loper is het document heel kort weg
                        emptyTimer = setTimeout(() => {
                            setActiveRunner(null);
                            setIsRunning(false);
                            setStartTime(null);
                            setElapsedTime(0);
                        }, 2500);
                    }
                });

                return () => {
                    clearTimeout(emptyTimer); clearTimeout(flushT);
                    unsubRunners();
                    unsubLaps();
                    unsubQueue();
                    unsubActiveRunner();
                };
            }, []);

            // Timer - calculate elapsed time from startTime
            useEffect(() => {
                let interval;
                
                if (isRunning && startTime) {
                    // Immediate update
                    setElapsedTime(tnow() - startTime);
                    
                    // De zichtbare klok is een eigen LiveClock; dit getal (schattingen, piste) hoeft maar 2x per seconde
                    interval = setInterval(() => {
                        setElapsedTime(tnow() - startTime);
                    }, (IS_DISPLAY_ONLY || URL_MODE === 'public') ? 30000 : 500);
                } else {
                    setElapsedTime(0);
                }
                
                return () => {
                    if (interval) clearInterval(interval);
                };
            }, [isRunning, startTime]);

            // Resync timer when page becomes visible again (fixes mobile background issue)
            useEffect(() => {
                const handleVisibilityChange = () => {
                    if (!document.hidden && isRunning && startTime) {
                        // Page is visible again, force immediate timer update
                        setElapsedTime(tnow() - startTime);
                        console.log('Timer resynchroniseerd na terugkeer naar app');
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                window.addEventListener('focus', handleVisibilityChange);
                
                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    window.removeEventListener('focus', handleVisibilityChange);
                };
            }, [isRunning, startTime]);

            // Monitor queue size and show warning
            useEffect(() => {
                if (!queueLoaded) { setShowLowQueueWarning(false); return; }   // nog aan het laden: niet ten onrechte 'leeg' melden
                const queueSize = queue.length;
                const hasActiveRunner = activeRunner !== null;
                
                // Show warning if queue is low (2 or fewer) and there's an active runner
                // Or if queue is completely empty
                if ((queueSize <= 2 && hasActiveRunner) || queueSize === 0) {
                    setShowLowQueueWarning(true);
                } else {
                    setShowLowQueueWarning(false);
                }
            }, [queue, activeRunner, queueLoaded]);

            // (Verbindingsstatus wordt nu centraal bijgehouden via syncState / SyncChip / SyncBanner)

            const formatTime = (ms) => {
                const totalSeconds = Math.floor(ms / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                const millis = Math.floor((ms % 1000) / 10);
                return `${minutes}:${seconds.toString().padStart(2, '0')}.${millis.toString().padStart(2, '0')}`;
            };

            const formatTimeSimple = (ms) => {
                const totalSeconds = Math.ceil(ms / 1000);   // zoals in de atletiek: naar boven afronden (1:21,1 -> 1:22)
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                return `${minutes}:${seconds.toString().padStart(2, '0')}`;
            };

            // Sort handler for table
            const handleSort = (column) => {
                if (sortColumn === column) {
                    // Toggle direction if same column
                    setSortDirection(sortDirection === 'asc' ? 'desc' : 'asc');
                } else {
                    // New column, default to ascending
                    setSortColumn(column);
                    setSortDirection('asc');
                }
            };

            // Get sort indicator
            const getSortIndicator = (column) => {
                if (sortColumn !== column) return '';
                return sortDirection === 'asc' ? ' ▲' : ' ▼';
            };

            // Handle sort for laps table
            const handleLapSort = (column) => {
                if (lapSortColumn === column) {
                    setLapSortDirection(lapSortDirection === 'asc' ? 'desc' : 'asc');
                } else {
                    setLapSortColumn(column);
                    setLapSortDirection('asc');
                }
            };

            // Get sort indicator for laps table
            const getLapSortIndicator = (column) => {
                if (lapSortColumn !== column) return '';
                return lapSortDirection === 'asc' ? ' ▲' : ' ▼';
            };

            // Toggle leaderboard collapse/expand
            const toggleLeaderboard = (leaderboardKey) => {
                setCollapsedLeaderboards(prev => ({
                    ...prev,
                    [leaderboardKey]: !prev[leaderboardKey]
                }));
            };

            // Get weather icon and description based on WMO weather code
            const getWeatherInfo = (code) => weatherInfo(code, weather ? weather.day : true);

            // Calculate wait times based on average lap time from last hour
            const getWaitTime = (position) => {
                // Positie 0 = volgende loper (staat klaar); anderen: verwachte wachttijd per loper
                if (position === 0) return 'Sta klaar';
                return `~${Math.max(1, Math.round(estimateWaitMs(position) / 60000))} min`;
            };

            // Firebase error handler wrapper
            const handleFirebaseOperation = async (operation, errorMessage) => {
                try {
                    await operation();
                    setLastSyncTime(Date.now());
                    return true;
                } catch (error) {
                    console.error('Firebase operation failed:', error);
                    setConnectionError(`${errorMessage}: ${error.message}`);
                    alert(`${errorMessage}\n\nFout: ${error.message}\n\nControleer je internetverbinding en probeer opnieuw.`);
                    return false;
                }
            };

            // --- Wachtrij: schatting en veilig toevoegen ---
            // Rondes per loper (eigen gemiddelde) en het groepsgemiddelde van het laatste uur, bijgehouden bij elke wijziging in de rondes
            const lapStats = React.useMemo(() => {
                const per = {}; let sumAll = 0;
                const seq = {}, lastAt = {};
                [...laps].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)).forEach(l => { (seq[l.runnerId] = seq[l.runnerId] || []).push(l.time); lastAt[l.runnerId] = new Date(l.timestamp).getTime(); });
                laps.forEach(l => { const e = per[l.runnerId] || (per[l.runnerId] = { n: 0, sum: 0 }); e.n++; e.sum += l.time; sumAll += l.time; });
                const hourAgo = Date.now() - 3600e3;
                const recent = laps.filter(l => new Date(l.timestamp).getTime() > hourAgo);
                const group = recent.length >= 5 ? recent.reduce((x, l) => x + l.time, 0) / recent.length
                    : laps.length >= 5 ? sumAll / laps.length : 100000;
                return { per, group, seq, lastAt };
            }, [laps]);
            const getAvgLapMs = () => lapStats.group;
            // Verwachte rondetijd van één loper: zijn eigen gemiddelde, bij weinig rondes bijgestuurd naar het groepsgemiddelde
            const expectedLapMs = (runnerId) => {
                const e = lapStats.per[runnerId];
                const rn = runners.find(r => r.id === runnerId);
                const prior = FIRST_LAP_MS[rn && rn.gender] || FIRST_LAP_MS.X;   // startwaarde uit de data van vorig jaar, per geslacht
                if (!e) return prior;
                const runningThis = activeRunner && isRunning && activeRunner.runnerId === runnerId && startTime;
                const rest = (runningThis ? +startTime : tnow()) - (lapStats.lastAt[runnerId] || tnow());   // rust sinds de vorige ronde
                return predictNext(lapStats.seq[runnerId] || [], rn && rn.gender, rest);   // recente rondes wegen zwaarder, na lange rust fris
            };
            // Wachttijd tot de loper op plaats idx (0 = eerste in de rij na de lopende loper) mag starten:
            // rest van de lopende loper (zijn eigen verwachte tijd min wat al gelopen is) + de verwachte tijd van elke loper ervoor + wissel
            const estimateWaitMs = (idx) => {
                const GAP = 2000;   // wissel tussen twee lopers (vorig jaar mediaan 0,9 s, 90% onder 1,6 s; met marge)
                const waitingList = queue.filter((q, i) => !(activeRunner && isRunning && i === 0));
                let t = 0;
                if (activeRunner && isRunning) t = Math.max(5000, expectedLapMs(activeRunner.runnerId) - (startTime ? tnow() - startTime : elapsedTime));
                for (let j = 0; j < idx && j < waitingList.length; j++) t += GAP + expectedLapMs(waitingList[j].runnerId);
                return t;
            };

            // Zet een bestaande loper in de wachtrij, maar nooit twee keer tegelijk
            const enqueueRunner = async (runner, force = false) => {
                if (!force && activeRunner && isRunning && activeRunner.runnerId === runner.id) {
                    return { ok: false, reason: 'running', name: runner.name, runner };
                }
                const waitingList = queue.filter((q, i) => !(activeRunner && isRunning && i === 0));
                const idx = waitingList.findIndex(q => q.runnerId === runner.id);
                if (!force && idx >= 0) {
                    return { ok: false, reason: 'queued', name: runner.name, position: idx + 1, waitMs: estimateWaitMs(idx), runner };
                }
                const last = recentAddsRef.current[runner.id];
                if (!force && last && Date.now() - last < 20000) {
                    return { ok: false, reason: 'queued', name: runner.name, position: waitingList.length, waitMs: estimateWaitMs(Math.max(0, waitingList.length - 1)), runner };
                }
                recentAddsRef.current[runner.id] = Date.now();
                try {
                    const maxOrder = queue.length > 0 ? Math.max(...queue.map(q => q.order || 0)) : -1;
                    await firestoreWrapper.collection('queue').add({
                        runnerId: runner.id,
                        runnerName: runner.name,
                        addedAt: new Date().toISOString(),
                        order: maxOrder + 1
                    });
                } catch (error) {
                    console.error('Toevoegen aan wachtrij mislukt:', error);
                    delete recentAddsRef.current[runner.id];
                    return { ok: false, reason: 'error', name: runner.name, message: error.message };
                }
                return { ok: true, name: runner.name, position: waitingList.length + 1, waitMs: estimateWaitMs(waitingList.length) };
            };

            // Nieuwe loper aanmaken (met controle op dubbels) en in de wachtrij zetten
            const addNewRunnerCore = async ({ first, last, gender }, force = false) => {
                const f = tidyName(first), l = tidyName(last);
                if (!f || !l) return { ok: false, reason: 'incomplete' };
                if (!gender) return { ok: false, reason: 'gender' };
                const fullName = `${f} ${l}`;
                if (!force) {
                    const similar = findSimilarRunners(f, l, runners);
                    if (similar.length) return { ok: false, reason: 'similar', matches: similar };
                }
                try {
                    const ref = await firestoreWrapper.collection('runners').add({
                        name: fullName, firstName: f, lastName: l, gender,
                        totalLaps: 0, totalTime: 0, addedAt: new Date().toISOString()
                    });
                    return await enqueueRunner({ id: ref.id, name: fullName });
                } catch (error) {
                    console.error('Loper aanmaken mislukt:', error);
                    return { ok: false, reason: 'error', name: fullName, message: error.message };
                }
            };

            // Resultaat van een toevoeg-actie tonen als melding onder het formulier (zonder popup)
            const handleAddResult = (res) => {
                if (res.ok) {
                    setFirstName(''); setLastName(''); setGenderInput(''); setNameInput(''); setShowSuggestions(false);
                    setQueueNotice({ type: 'ok', text: `${res.name} staat in de wachtrij`, detail: `Plek ${res.position} · ${res.waitMs <= 5000 ? 'zo meteen aan de beurt' : res.waitMs < 90000 ? `wachttijd ± ${Math.max(10, Math.round(res.waitMs / 10000) * 10)} s` : `wachttijd ± ${Math.max(1, Math.round(res.waitMs / 60000))} min`}` });
                } else if (res.reason === 'similar') {
                    setQueueNotice({ type: 'ask', matches: res.matches });
                } else if (res.reason === 'queued') {
                    setFirstName(''); setLastName(''); setGenderInput(''); setNameInput(''); setShowSuggestions(false);
                    setQueueNotice({ type: 'dup', runner: res.runner, text: `${res.name} staat al in de wachtrij (plek ${res.position}).` });
                } else if (res.reason === 'running') {
                    setNameInput(''); setShowSuggestions(false);
                    setQueueNotice({ type: 'dup', runner: res.runner, text: `${res.name} loopt nu al.` });
                } else if (res.reason === 'error') {
                    setQueueNotice({ type: 'warn', text: `Toevoegen mislukt: ${res.message}` });
                }
            };

            const addRunner = async (forceNew) => {
                if (!firstName.trim() || !lastName.trim()) { setQueueNotice({ type: 'warn', text: 'Vul voornaam en achternaam in.' }); return; }
                if (!genderInput) { setQueueNotice({ type: 'warn', text: 'Kies een gender.' }); return; }
                handleAddResult(await addNewRunnerCore({ first: firstName, last: lastName, gender: genderInput }, forceNew === true));
            };

            const renderQueueNotice = () => {
                if (!queueNotice) return null;
                if (queueNotice.type === 'ask') {
                    return h('div', { className: 'mb-4 rounded-lg border-2 border-yellow-400 bg-yellow-50 p-3 text-sm' },
                        h('div', { className: 'font-semibold text-yellow-800 mb-2' }, 'Bestaat deze loper al? Bedoel je:'),
                        queueNotice.matches.map(m => h('button', {
                            key: m.runner.id,
                            onClick: async () => handleAddResult(await enqueueRunner(m.runner)),
                            className: 'block w-full text-left px-3 py-2 mb-1 rounded bg-white border border-yellow-400 hover:bg-yellow-100 text-gray-800'
                        }, `${m.runner.name} (${m.runner.totalLaps || 0} ${(m.runner.totalLaps || 0) === 1 ? 'ronde' : 'rondes'})`)),
                        h('div', { className: 'flex gap-3 mt-1' },
                            h('button', { onClick: () => addRunner(true), className: 'text-yellow-800 underline' }, 'Nee, andere persoon: nieuwe loper aanmaken'),
                            h('button', { onClick: () => setQueueNotice(null), className: 'text-gray-500 underline' }, 'Annuleren')
                        )
                    );
                }
                if (queueNotice.type === 'dup') {
                    return h('div', { className: 'mb-4 rounded-lg border-2 border-blue-400 bg-blue-50 p-3 text-sm text-blue-900' },
                        h('div', { className: 'font-semibold' }, queueNotice.text),
                        queueNotice.runner && h('div', { className: 'mt-1' }, 'Wil je deze loper toch nog eens achteraan toevoegen?'),
                        h('div', { className: 'flex gap-2 mt-2' },
                            queueNotice.runner && h('button', { onClick: async () => handleAddResult(await enqueueRunner(queueNotice.runner, true)), className: 'px-3 py-1.5 rounded-lg font-bold bg-humasol-orange text-white' }, 'Ja, nog een keer'),
                            h('button', { onClick: () => setQueueNotice(null), className: 'px-3 py-1.5 rounded-lg font-bold bg-white border-2 border-blue-400 text-blue-900' }, queueNotice.runner ? 'Nee, laat maar' : 'Oké')
                        )
                    );
                }
                const cls = queueNotice.type === 'ok' ? 'bg-green-50 border-green-500 text-green-800'
                    : queueNotice.type === 'info' ? 'bg-blue-50 border-blue-400 text-blue-800'
                    : 'bg-red-50 border-red-400 text-red-700';
                if (queueNotice.type === 'ok' && queueNotice.detail) return h('div', { className: 'mb-4 rounded-lg px-4 py-3', style: { border: '3px solid #17120d', background: '#d9f7d0', boxShadow: '4px 4px 0 #17120d' } },
                    h('div', { className: 'text-sm font-bold text-gray-800' }, queueNotice.text),
                    h('div', { className: 'text-2xl font-extrabold text-gray-900' }, queueNotice.detail));
                return h('div', { className: `mb-4 rounded-lg border-2 px-3 py-2 text-sm font-medium ${cls}` }, queueNotice.text);
            };

            // Actieve loper: één document met vaste id ("current"); geen leesactie, werkt dus ook offline
            const writeActiveRunnerDoc = async (data) => {
                if (isFirebaseConfigured) {
                    activeDocIdsRef.current.filter(id => id !== 'current').forEach(id => firestoreWrapper.collection('activeRunner').doc(id).delete());
                    await firestoreWrapper.collection('activeRunner').doc('current').set(data);
                } else if (demoStorage.activeRunner.length === 0) {
                    await firestoreWrapper.collection('activeRunner').add(data);
                } else {
                    await firestoreWrapper.collection('activeRunner').doc('0').set(data);
                }
            };
            const clearActiveRunnerInFirebase = async () => {
                try {
                    if (isFirebaseConfigured) {
                        const ids = new Set([...activeDocIdsRef.current, 'current']);
                        ids.forEach(id => firestoreWrapper.collection('activeRunner').doc(id).delete());
                    } else {
                        demoStorage.activeRunner = [];
                        firestoreWrapper._notifyListeners('activeRunner');
                    }
                } catch (error) {
                    console.error('Error clearing active runner:', error);
                }
            };
            const updateActiveRunnerInFirebase = async (runner, running) => {
                try {
                    await writeActiveRunnerDoc({
                        runner: runner,
                        isRunning: running,
                        startTime: running ? new Date(tnow()).toISOString() : null
                    });
                } catch (error) {
                    console.error('Error updating active runner:', error);
                }
            };

            const nextRunner = async () => {
                // Debouncing: prevent double clicks
                if (isProcessingNext) {
                    console.log('Dubbele klik voorkomen');
                    return;
                }
                setIsProcessingNext(true);

                try {
                    if (!activeRunner) {
                        // Start first runner
                        if (!queue.length) {
                            alert('Geen lopers in de wachtrij!');
                            return;
                        }
                        
                        // Prevent Firebase flicker
                        ignoreFirebaseUpdatesRef.current = true;
                        
                        // Update local state immediately
                        const now = tnow();
                        setActiveRunner(queue[0]);
                        setIsRunning(true);
                        setStartTime(now);
                        setElapsedTime(0);
                        
                        // Save to Firebase for display sync
                        await updateActiveRunnerInFirebase(queue[0], true);
                        
                        // Re-enable Firebase updates
                        setTimeout(() => {
                            ignoreFirebaseUpdatesRef.current = false;
                        }, 500);
                    } else {
                        // Save current and start next
                        await saveLap(startTime ? tnow() - startTime : elapsedTime, true);
                    }
                } finally {
                    // Reset debounce flag after 5 seconds to prevent accidental double-clicks
                    setTimeout(() => setIsProcessingNext(false), 5000);
                }
            };

            const stopWithoutNext = async () => {
                await saveLap(startTime ? tnow() - startTime : elapsedTime, false);
            };

            const saveManualTime = () => {
                const parts = manualTime.split(':');
                if (parts.length !== 2) {
                    alert('Gebruik MM:SS formaat (bijv. 3:45)');
                    return;
                }
                const [min, sec] = parts.map(Number);
                if (isNaN(min) || isNaN(sec)) {
                    alert('Ongeldige tijd!');
                    return;
                }
                const timeMs = (min * 60 + sec) * 1000;
                saveLap(timeMs, true);
                setManualTime('');
            };

            const saveLap = async (timeMs, startNext = true) => {
                if (!activeRunner) return;

                const runner = runners.find(r => r.id === activeRunner.runnerId);
                
                // Calculate start time (current time minus elapsed time)
                const finishTime = new Date(tnow());
                const startTime = new Date(finishTime.getTime() - timeMs);

                // Check if this is a personal record
                const runnerPreviousLaps = laps.filter(l => l.runnerId === activeRunner.runnerId);
                const previousBest = runnerPreviousLaps.length > 0 ? Math.min(...runnerPreviousLaps.map(l => l.time)) : Infinity;
                const isPersonalRecord = timeMs < previousBest;

                // SNAPSHOT: Save complete state BEFORE any changes for undo
                const stateSnapshot = {
                    activeRunner: { ...activeRunner },
                    activeRunnerStartTime: startTime, // When they started running (from state)
                    elapsedTime: elapsedTime,
                    isRunning: isRunning,
                    queueFirstId: queue.length > 0 ? queue[0].id : null,
                    queueFirstItem: queue.length > 0 ? { ...queue[0] } : null, // Full first queue item
                    nextRunner: startNext && queue.length > 1 ? { ...queue[1] } : null,
                    nextRunnerId: startNext && queue.length > 1 ? queue[1].id : null,
                    runnerPreviousTotalLaps: runner ? runner.totalLaps : 0,
                    runnerPreviousTotalTime: runner ? runner.totalTime : 0,
                    timestamp: Date.now()
                };

                // Store lap data for potential undo
                const lapData = {
                    runnerId: activeRunner.runnerId,
                    runnerName: activeRunner.runnerName,
                    time: timeMs,
                    distance: 515,
                    timestamp: finishTime.toISOString(),
                    startTime: startTime.toISOString(),
                    isPersonalRecord: isPersonalRecord,
                    lapNumber: runner ? runner.totalLaps + 1 : 1
                };

                let lapId = null;
                let nextRunnerStarted = false;
                
                // Prevent Firebase listener from interfering during transition
                ignoreFirebaseUpdatesRef.current = true;
                
                const success = await handleFirebaseOperation(async () => {
                    const docRef = await firestoreWrapper.collection('laps').add(lapData);
                    lapId = docRef.id;

                    if (runner) {
                        await firestoreWrapper.collection('runners').doc(activeRunner.runnerId).update({
                            totalLaps: runner.totalLaps + 1,
                            totalTime: runner.totalTime + timeMs
                        });
                    }

                    // Remove current runner from queue
                    await firestoreWrapper.collection('queue').doc(queue[0].id).delete();

                    // Update local state FIRST (before Firebase) to prevent UI flicker
                    if (startNext && queue.length > 1) {
                        // Start next runner immediately in local state
                        const now = tnow();
                        setActiveRunner(queue[1]);
                        setStartTime(now);
                        setElapsedTime(0);
                        setIsRunning(true);
                        
                        // Now update Firebase (this won't cause flicker anymore)
                        await updateActiveRunnerInFirebase(queue[1], true);
                    } else {
                        // Stop completely
                        setActiveRunner(null);
                        setStartTime(null);
                        setElapsedTime(0);
                        setIsRunning(false);
                        
                        // Clear Firebase
                        await clearActiveRunnerInFirebase();
                    }
                }, 'Kan ronde niet opslaan');
                
                // Re-enable Firebase updates after a short delay
                setTimeout(() => {
                    ignoreFirebaseUpdatesRef.current = false;
                }, 500);

                if (success && lapId) {
                    // Save complete action snapshot for full rollback capability
                    setLastAction({
                        type: 'lap',
                        lapId: lapId,
                        lapData: lapData,
                        stateSnapshot: stateSnapshot,
                        nextRunnerStarted: startNext && queue.length > 1
                    });
                } else if (!success) {
                    // If save failed, keep the timer running so data isn't lost
                    console.error('Ronde opslaan mislukt: de timer blijft lopen');
                }
            };

            const cancelCurrentRun = async () => {
                if (await askConfirm('Weet je zeker dat je de huidige loop wilt annuleren zonder op te slaan?')) {
                    setActiveRunner(null);
                    setElapsedTime(0);
                    setIsRunning(false);
                    
                    // Clear active runner from Firebase
                    await clearActiveRunnerInFirebase();
                }
            };

            const deleteLastLap = async () => {
                if (laps.length === 0) {
                    alert('Geen rondes om te verwijderen');
                    return;
                }

                if (!await askConfirm('Weet je zeker dat je de laatste ronde wilt verwijderen?')) {
                    return;
                }

                const lastLap = laps[laps.length - 1];
                
                // Update runner stats
                const runner = runners.find(r => r.id === lastLap.runnerId);
                if (runner && runner.totalLaps > 0) {
                    await firestoreWrapper.collection('runners').doc(lastLap.runnerId).update({
                        totalLaps: runner.totalLaps - 1,
                        totalTime: Math.max(0, runner.totalTime - lastLap.time)
                    });
                }

                // Delete lap
                await firestoreWrapper.collection('laps').doc(laps[laps.length - 1].id).delete();
                
                alert('Laatste ronde verwijderd!');
            };

            const undoLastAction = async () => {
                if (!lastAction) {
                    alert('Geen actie om ongedaan te maken');
                    return;
                }

                // Check if action is recent (within last 2 minutes for safety)
                const twoMinutesAgo = Date.now() - (2 * 60 * 1000);
                if (lastAction.stateSnapshot.timestamp < twoMinutesAgo) {
                    if (!await askConfirm('De laatste actie is meer dan 2 minuten geleden. Weet je zeker dat je deze wilt ongedaan maken?')) {
                        return;
                    }
                }

                if (lastAction.type === 'lap') {
                    const snapshot = lastAction.stateSnapshot;
                    
                    if (!await askConfirm(`Weet je zeker dat je de laatste actie wilt ongedaan maken?\n\n${lastAction.lapData.runnerName}'s ronde (${formatTimeSimple(lastAction.lapData.time)}) wordt verwijderd en de timer gaat terug naar ${snapshot.activeRunner.runnerName}.`)) {
                        return;
                    }

                    // Prevent Firebase listener from interfering
                    ignoreFirebaseUpdatesRef.current = true;

                    const success = await handleFirebaseOperation(async () => {
                        // 1. Delete the lap from Firebase
                        await firestoreWrapper.collection('laps').doc(lastAction.lapId).delete();

                        // 2. Restore the previous runner's stats
                        await firestoreWrapper.collection('runners').doc(snapshot.activeRunner.runnerId).update({
                            totalLaps: snapshot.runnerPreviousTotalLaps,
                            totalTime: snapshot.runnerPreviousTotalTime
                        });

                        // 3. Restore the queue to original state
                        if (lastAction.nextRunnerStarted) {
                            // Re-add the original runner back to the FRONT of queue
                            if (snapshot.queueFirstItem) {
                                // Use a timestamp earlier than any current queue item to ensure it's first
                                const earlyTimestamp = new Date(Date.now() - 1000 * 60 * 60).toISOString(); // 1 hour ago
                                
                                await firestoreWrapper.collection('queue').add({
                                    runnerId: snapshot.queueFirstItem.runnerId,
                                    runnerName: snapshot.queueFirstItem.runnerName,
                                    addedAt: earlyTimestamp, // Ensures it sorts first
                                    position: 0
                                });
                            }

                            // Clear the current active runner from Firebase
                            await clearActiveRunnerInFirebase();
                        }
                    }, 'Ongedaan maken is niet gelukt');

                    if (success) {
                        // 4. Restore local state IMMEDIATELY (before Firebase updates)
                        const originalStartTime = snapshot.activeRunnerStartTime;
                        const timeSinceStart = Date.now() - originalStartTime;
                        
                        // Restore the previous runner with corrected elapsed time
                        setActiveRunner(snapshot.activeRunner);
                        setStartTime(originalStartTime);
                        setElapsedTime(timeSinceStart);
                        setIsRunning(true);
                        
                        // Clear last action immediately
                        setLastAction(null);
                        
                        // Update Firebase AFTER local state (async, won't cause flicker)
                        setTimeout(async () => {
                            try {
                                const data = {
                                    runner: snapshot.activeRunner,
                                    isRunning: true,
                                    startTime: new Date(originalStartTime).toISOString()
                                };
                                
                                await writeActiveRunnerDoc(data);
                            } catch (error) {
                                console.error('Error updating Firebase after undo:', error);
                            }
                        }, 0);
                        
                        // Re-enable Firebase updates after delay
                        setTimeout(() => {
                            ignoreFirebaseUpdatesRef.current = false;
                        }, 500);
                        
                        alert(`Timer teruggezet naar ${snapshot.activeRunner.runnerName}!`);
                    } else {
                        // If failed, re-enable Firebase updates immediately
                        ignoreFirebaseUpdatesRef.current = false;
                    }
                }
            };

            const deleteLap = async (lap) => {
                if (!await askConfirm(`Weet je zeker dat je de ronde van ${lap.runnerName} (${formatTimeSimple(lap.time)}) wilt verwijderen?`)) {
                    return;
                }

                // Update runner stats
                const runner = runners.find(r => r.id === lap.runnerId);
                if (runner && runner.totalLaps > 0) {
                    await firestoreWrapper.collection('runners').doc(lap.runnerId).update({
                        totalLaps: runner.totalLaps - 1,
                        totalTime: Math.max(0, runner.totalTime - lap.time)
                    });
                }

                // Delete lap
                await firestoreWrapper.collection('laps').doc(lap.id).delete();
                
                alert('Ronde verwijderd!');
            };

            const startEditingLap = (lap) => {
                setEditingLapId(lap.id);
                // Convert ms to MM:SS format
                const totalSeconds = Math.floor(lap.time / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                setEditingLapTime(`${minutes}:${seconds.toString().padStart(2, '0')}`);
            };

            const cancelEditingLap = () => {
                setEditingLapId(null);
                setEditingLapTime('');
            };

            const saveEditedLap = async (lap) => {
                // Parse the time input
                const parts = editingLapTime.split(':');
                if (parts.length !== 2) {
                    alert('Gebruik MM:SS formaat (bijv. 3:45)');
                    return;
                }
                const [min, sec] = parts.map(Number);
                if (isNaN(min) || isNaN(sec)) {
                    alert('Ongeldige tijd!');
                    return;
                }
                const newTimeMs = (min * 60 + sec) * 1000;

                if (newTimeMs <= 0) {
                    alert('Tijd moet groter zijn dan 0!');
                    return;
                }

                const oldTimeMs = lap.time;
                const timeDifference = newTimeMs - oldTimeMs;

                // Update lap time
                await firestoreWrapper.collection('laps').doc(lap.id).update({
                    time: newTimeMs
                });

                // Update runner total time
                const runner = runners.find(r => r.id === lap.runnerId);
                if (runner) {
                    await firestoreWrapper.collection('runners').doc(lap.runnerId).update({
                        totalTime: Math.max(0, runner.totalTime + timeDifference)
                    });
                }

                setEditingLapId(null);
                setEditingLapTime('');
                alert('Tijd aangepast!');
            };

            const addNewLapManually = async () => {
                if (!newLapRunnerId || !newLapTime) {
                    alert('Selecteer een loper en voer een tijd in!');
                    return;
                }

                // Parse the time input
                const parts = newLapTime.split(':');
                if (parts.length !== 2) {
                    alert('Gebruik MM:SS formaat (bijv. 3:45)');
                    return;
                }
                const [min, sec] = parts.map(Number);
                if (isNaN(min) || isNaN(sec)) {
                    alert('Ongeldige tijd!');
                    return;
                }
                const timeMs = (min * 60 + sec) * 1000;

                if (timeMs <= 0) {
                    alert('Tijd moet groter zijn dan 0!');
                    return;
                }

                // Get runner info
                const runner = runners.find(r => r.id === newLapRunnerId);
                if (!runner) {
                    alert('Loper niet gevonden!');
                    return;
                }

                // Parse timestamp
                const timestamp = new Date(newLapTimestamp);
                if (isNaN(timestamp.getTime())) {
                    alert('Ongeldige datum/tijd!');
                    return;
                }

                // Calculate start time
                const startTime = new Date(timestamp.getTime() - timeMs);

                // Check if this is a personal record
                const runnerPreviousLaps = laps.filter(l => l.runnerId === newLapRunnerId);
                const previousBest = runnerPreviousLaps.length > 0 ? Math.min(...runnerPreviousLaps.map(l => l.time)) : Infinity;
                const isPersonalRecord = timeMs < previousBest;

                // Add lap to Firestore
                const lapData = {
                    runnerId: newLapRunnerId,
                    runnerName: runner.name,
                    time: timeMs,
                    distance: 515,
                    timestamp: timestamp.toISOString(),
                    startTime: startTime.toISOString(),
                    isPersonalRecord: isPersonalRecord,
                    lapNumber: runner.totalLaps + 1
                };

                await firestoreWrapper.collection('laps').add(lapData);

                // Update runner stats
                await firestoreWrapper.collection('runners').doc(newLapRunnerId).update({
                    totalLaps: runner.totalLaps + 1,
                    totalTime: runner.totalTime + timeMs
                });

                // Reset form
                setNewLapRunnerId('');
                setNewLapTime('');
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                setNewLapTimestamp(now.toISOString().slice(0, 16));
                setShowAddLapForm(false);

                alert('Ronde succesvol toegevoegd!');
            };

            const removeFromQueue = async (queueItem) => {
                if (await askConfirm(`${queueItem.runnerName} uit de wachtrij verwijderen?`)) {
                    await firestoreWrapper.collection('queue').doc(queueItem.id).delete();
                }
            };

            const moveRunnerUp = async (index) => {
                if (index === 0) return; // Already at top
                
                const currentRunner = queue[index];
                const previousRunner = queue[index - 1];
                
                // Swap order values
                await firestoreWrapper.collection('queue').doc(currentRunner.id).update({
                    addedAt: previousRunner.addedAt
                });
                await firestoreWrapper.collection('queue').doc(previousRunner.id).update({
                    addedAt: currentRunner.addedAt
                });
            };

            const moveRunnerDown = async (index) => {
                if (index === queue.length - 1) return; // Already at bottom
                
                const currentRunner = queue[index];
                const nextRunner = queue[index + 1];
                
                // Swap order values
                await firestoreWrapper.collection('queue').doc(currentRunner.id).update({
                    addedAt: nextRunner.addedAt
                });
                await firestoreWrapper.collection('queue').doc(nextRunner.id).update({
                    addedAt: currentRunner.addedAt
                });
            };

            // Drag & Drop handlers for queue reordering
            const handleDragStart = (e, index) => {
                setDraggedIndex(index);
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/html', e.currentTarget);
                // Add some visual feedback
                e.currentTarget.style.opacity = '0.5';
            };

            const handleDragEnd = (e) => {
                e.currentTarget.style.opacity = '1';
                setDraggedIndex(null);
                setDragOverIndex(null);
            };

            const handleDragOver = (e, index) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                setDragOverIndex(index);
            };

            const handleDragLeave = (e) => {
                setDragOverIndex(null);
            };

            const handleDrop = async (e, dropIndex) => {
                e.preventDefault();
                
                if (draggedIndex === null || draggedIndex === dropIndex) {
                    setDraggedIndex(null);
                    setDragOverIndex(null);
                    return;
                }

                // Reorder the queue by updating all timestamps
                try {
                    const reorderedQueue = [...queue];
                    const [draggedItem] = reorderedQueue.splice(draggedIndex, 1);
                    reorderedQueue.splice(dropIndex, 0, draggedItem);
                    
                    // Update all items with new timestamps to preserve order
                    const baseTime = Date.now();
                    const updates = reorderedQueue.map((item, index) => {
                        return firestoreWrapper.collection('queue').doc(item.id).update({
                            addedAt: baseTime + index
                        });
                    });
                    
                    await Promise.all(updates);
                } catch (error) {
                    console.error('Error reordering queue:', error);
                }
                
                setDraggedIndex(null);
                setDragOverIndex(null);
            };

            // ===== Oefenmodus (?ns=oefen): data van vorig jaar laden en snel een wachtrij vullen =====
            const seedPracticeData = async () => {
                if (!NS) return;
                if (!await askConfirm(`Oefendata laden in "${NS}"?\n\nHet event van vorig jaar (met dummynamen) tot nu. Bestaande oefendata wordt overschreven. Je echte data blijft onaangeroerd.`)) return;
                const sim = buildSimPlan(2026, Number(practiceHours) || 0);
                const now = Date.now();
                const finished = sim.plan.filter(l => l.f <= now);
                const stats = {};
                finished.forEach(l => { const st = stats[l.ri] || (stats[l.ri] = { laps: 0, total: 0 }); st.laps++; st.total += l.ms; });
                const riList = Object.keys(stats);
                setSeedStatus({ running: true, text: 'Bezig…' });
                await firestoreWrapper.collection('runners').setMany(riList.map(ri => {
                    const r = sim.runners[ri];
                    return { id: `oefen_${ri}`, data: {
                        name: r.name, firstName: r.firstName, lastName: r.lastName, gender: r.gender,
                        totalLaps: stats[ri].laps, totalTime: stats[ri].total, addedAt: new Date(sim.start).toISOString()
                    } };
                }));
                const lapNo = {};
                await firestoreWrapper.collection('laps').setMany(finished.map((l, i) => {
                    lapNo[l.ri] = (lapNo[l.ri] || 0) + 1;
                    return { id: `oefen_lap_${String(i).padStart(4, '0')}`, data: {
                        runnerId: `oefen_${l.ri}`, runnerName: sim.runners[l.ri].name, time: l.ms, distance: 515,
                        timestamp: new Date(l.f).toISOString(), startTime: new Date(l.s).toISOString(),
                        isPersonalRecord: l.pr, lapNumber: lapNo[l.ri]
                    } };
                }));
                setSeedStatus({ running: false, text: `${riList.length} lopers en ${finished.length} rondes geladen` });
            };
            // Oefenomgeving leegmaken en het CSV-bestand van vorig jaar (met echte namen) erin laden.
            // Rondes tot nu komen meteen in de oefenomgeving; de rest wordt bewaard voor autoplay.
            const importPracticeCsv = async (file) => {
                if (!NS || !file) return;
                if (!await askConfirm(`CSV importeren in "${NS}"?\n\nDit vervangt ALLE data in deze oefenomgeving. Je echte data blijft onaangeroerd.`)) return;
                try {
                    setSeedStatus({ running: true, text: 'CSV lezen…' });
                    const rows = parseCsv(await file.text());
                    const head = rows[0].map(x => x.trim());
                    const col = (name) => head.findIndex(h => h === name);
                    const cName = col('Naam'), cSecs = col('Tijd (seconden)'), cStart = col('Start Tijd'), cFinish = col('Finish Tijd');
                    if ([cName, cSecs, cStart, cFinish].some(i => i < 0)) throw new Error('Kolommen niet gevonden (Naam, Tijd (seconden), Start Tijd, Finish Tijd)');
                    const parseDt = (str) => { const m = /(\d+)-(\d+)-(\d+),\s*(\d+):(\d+):(\d+)/.exec(str || ''); return m ? new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +m[6]).getTime() : NaN; };
                    const laps0 = rows.slice(1).filter(r => r.length > cFinish && r[cName]).map(r => ({
                        name: r[cName].trim(), ms: Math.round(parseFloat(r[cSecs]) * 1000), start: parseDt(r[cStart]), finish: parseDt(r[cFinish])
                    })).filter(l => l.ms > 0 && !isNaN(l.finish));
                    laps0.sort((a, b) => a.finish - b.finish);
                    if (!laps0.length) throw new Error('Geen rondes gevonden in dit bestand');

                    // verschuif het event naar "gisteren 20:00" (zelfde regel als de simulatie)
                    const ev0 = new Date(laps0[0].start - laps0[0].ms); ev0.setHours(20, 0, 0, 0);
                    if (ev0.getTime() > laps0[0].start) ev0.setDate(ev0.getDate() - 1);
                    const nowMs = Date.now();
                    const d0 = new Date(nowMs); d0.setHours(20, 0, 0, 0);
                    if (d0.getTime() > nowMs) d0.setDate(d0.getDate() - 1);
                    let target = d0.getTime();
                    if (nowMs - target < 6 * 3600e3) target -= 24 * 3600e3;
                    if (Number(practiceHours) > 0) target = nowMs - Number(practiceHours) * 3600e3;   // het event is nu al N uur bezig
                    const shift = target - ev0.getTime();

                    // lopers (zelfde persoon = zelfde naam, hoofdletters/accenten genegeerd) en lopende totalen per ronde
                    const byKey = {}; const runnerList = []; const best = {};
                    const all = laps0.map((l, i) => {
                        const key = nameKey(l.name);
                        if (!byKey[key]) {
                            const full = tidyName(l.name); const parts = full.split(' ');
                            byKey[key] = { id: `import_r_${runnerList.length}`, name: full, firstName: parts[0], lastName: parts.slice(1).join(' '), gender: guessGender(parts[0]), laps: 0, total: 0, firstStart: (l.finish - l.ms) + shift };
                            runnerList.push(byKey[key]);
                        }
                        const r = byKey[key]; r.laps++; r.total += l.ms;
                        const pr = best[r.id] === undefined || l.ms < best[r.id]; if (pr) best[r.id] = l.ms;
                        return { seq: i, r, ms: l.ms, startTs: (l.finish - l.ms) + shift, finishTs: l.finish + shift, lapNumber: r.laps, totalLapsAfter: r.laps, totalTimeAfter: r.total, isPR: pr };
                    });
                    const past = all.filter(l => l.finishTs <= nowMs), future = all.filter(l => l.finishTs > nowMs);

                    // oefenomgeving leegmaken (ook de bewaarde toekomstige rondes)
                    setSeedStatus({ running: true, text: 'Oefenomgeving leegmaken…' });
                    await firestoreWrapper.collection('laps').deleteMany(laps.map(l => l.id));
                    await firestoreWrapper.collection('runners').deleteMany(runners.map(r => r.id));
                    await firestoreWrapper.collection('queue').deleteMany(queue.map(q => q.id));
                    await clearActiveRunnerInFirebase();
                    try { const old = await db.collection(colName('replay')).get({ source: 'server' }); await firestoreWrapper.collection('replay').deleteMany(old.docs.map(d => d.id)); } catch (e) { console.warn('replay leegmaken:', e.message); }

                    // runners met totalen zoals ze nu zijn (laatste ronde tot nu)
                    const lastPast = {}; past.forEach(l => { lastPast[l.r.id] = l; });
                    const runnerDocs = Object.values(lastPast).map(l => ({ id: l.r.id, data: { name: l.r.name, firstName: l.r.firstName, lastName: l.r.lastName, gender: l.r.gender, totalLaps: l.totalLapsAfter, totalTime: l.totalTimeAfter, addedAt: new Date(l.r.firstStart).toISOString() } }));
                    const lapId = (seq) => `import_l_${String(seq).padStart(4, '0')}`;
                    const lapDocs = past.map(l => ({ id: lapId(l.seq), data: {
                        runnerId: l.r.id, runnerName: l.r.name, time: l.ms, distance: 515,
                        timestamp: new Date(l.finishTs).toISOString(), startTime: new Date(l.startTs).toISOString(), isPersonalRecord: l.isPR, lapNumber: l.lapNumber
                    } }));
                    const replayDocs = future.map(l => ({ id: `import_p_${String(l.seq).padStart(4, '0')}`, data: {
                        seq: l.seq, runnerId: l.r.id, name: l.r.name, firstName: l.r.firstName, lastName: l.r.lastName, gender: l.r.gender, firstStart: l.r.firstStart,
                        ms: l.ms, startTs: l.startTs, finishTs: l.finishTs, lapNumber: l.lapNumber, totalLapsAfter: l.totalLapsAfter, totalTimeAfter: l.totalTimeAfter, isPR: l.isPR
                    } }));
                    setSeedStatus({ running: true, text: 'Schrijven…' });
                    await firestoreWrapper.collection('runners').setMany(runnerDocs);
                    await firestoreWrapper.collection('laps').setMany(lapDocs);
                    await firestoreWrapper.collection('replay').setMany(replayDocs);
                    setSeedStatus({ running: false, text: `${runnerDocs.length} lopers en ${lapDocs.length} rondes geïmporteerd; nog ${replayDocs.length} rondes voor autoplay (gender afgeleid uit de voornaam)` });
                } catch (err) {
                    console.error('Import mislukt:', err);
                    setSeedStatus({ running: false, text: `Import mislukt: ${err.message}` });
                }
            };

            const queueRandomRunners = async () => {
                const taken = new Set(queue.map(q => q.runnerId));
                const pool = runners.filter(r => !taken.has(r.id));
                const n = Math.min(12, pool.length);
                for (let i = 0; i < n; i++) {
                    const r = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
                    await enqueueRunner(r);
                    await new Promise(res => setTimeout(res, 8));
                }
                setSeedStatus({ running: false, text: `${n} lopers in de wachtrij gezet` });
            };

            // Volgorde van de volledige wachtrij aanpassen (index in `queue`, de lopende loper staat op 0)
            const reorderQueue = async (fromIdx, toIdx) => {
                if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0 || fromIdx >= queue.length || toIdx >= queue.length) return;
                const lo = Math.min(fromIdx, toIdx), hi = Math.max(fromIdx, toIdx);
                const reordered = [...queue];
                const [item] = reordered.splice(fromIdx, 1);
                reordered.splice(toIdx, 0, item);
                // Enkel het verplaatste stuk krijgt nieuwe tijdstippen (dezelfde tijdstippen, in nieuwe volgorde)
                const times = queue.slice(lo, hi + 1).map(q => new Date(q.addedAt).getTime()).sort((a, b) => a - b);
                for (let k = 1; k < times.length; k++) if (times[k] <= times[k - 1]) times[k] = times[k - 1] + 1;
                const nextOutside = queue[hi + 1] ? new Date(queue[hi + 1].addedAt).getTime() : Infinity;
                let updates;
                if (times[times.length - 1] < nextOutside) {
                    updates = reordered.slice(lo, hi + 1).map((it, k) => ({ id: it.id, data: { addedAt: new Date(times[k]).toISOString() } }));
                } else {
                    const base = Date.now();   // zeldzaam: tijdstippen botsen, dan alles opnieuw nummeren
                    updates = reordered.map((it, k) => ({ id: it.id, data: { addedAt: new Date(base + k).toISOString() } }));
                }
                await firestoreWrapper.collection('queue').updateMany(updates);
            };

            // ===== Beheer: lopers aanpassen, verwijderen en alles wissen =====

                if (myLaps.length) await firestoreWrapper.collection('laps').updateMany(myLaps);
                const myQ = queue.filter(q => q.runnerId === r.id).map(q => ({ id: q.id, data: { runnerName: nm } }));

            const removeRunner = async (r) => {

                const lids = laps.filter(l => l.runnerId === r.id).map(l => l.id), qids = queue.filter(q => q.runnerId === r.id).map(q => q.id);

            const unlockAdmin = () => {

            // Export functions
            const exportToCSV = () => {

                // Create CSV header
                let csv = 'Naam,Ronde Nummer,Tijd (MM:SS),Tijd (seconden),Start Tijd,Finish Tijd,Afstand (m),Persoonlijk Record,Algemeen Record\n';

                // Sort laps by timestamp
                const sortedLaps = [...laps].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

                // Get overall record time
                const overallRecordTime = Math.min(...laps.map(l => l.time));

                // Add data rows
                sortedLaps.forEach((lap, idx) => {

                    const isPersonalRecord = lap.time === runnerBestTime;

                    csv += `"${lap.runnerName}",${idx + 1},${formatTimeSimple(lap.time)},${timeSeconds},"${startTime}","${finishTime}",515,${isPersonalRecord ? 'Ja' : 'Nee'},${isOverallRecord ? 'Ja' : 'Nee'}\n`;

                // Create download

                    csv += `"${runner.name}",${runner.totalLaps},${totalDistance.toFixed(2)},${formatTimeSimple(runner.totalTime)},${avgTime ? formatTimeSimple(avgTime) : '--:--'},${fastestTime ? formatTimeSimple(fastestTime) : '--:--'}\n`;

                const url = URL.createObjectURL(blob);

            // Stats
            const totalLaps = laps.length;
            const totalDistance = (totalLaps * 515) / 1000;
            const fastestLap = laps.length ? Math.min(...laps.map(l => l.time)) : 0;
            const avgLapTime = laps.length ? laps.reduce((sum, l) => sum + l.time, 0) / laps.length : 0;

            const fastestLaps = [...laps].sort((a, b) => a.time - b.time).slice(0, 10);
            
            const lapsByRunner = runners.map(runner => ({
                ...runner,
                laps: laps.filter(l => l.runnerId === runner.id).length

            const avgTimeByRunner = runners.map(runner => {
                const runnerLaps = laps.filter(l => l.runnerId === runner.id);
                const avg = runnerLaps.length ? runnerLaps.reduce((sum, l) => sum + l.time, 0) / runnerLaps.length : 0;
                return { ...runner, avgTime: avg, lapCount: runnerLaps.length };
            }).filter(r => r.lapCount > 0).sort((a, b) => a.avgTime - b.avgTime);

            // Gender-specific rankings
            const getRunnerGender = (runnerId) => {
                const runner = runners.find(r => r.id === runnerId);
                return runner?.gender || 'X';
