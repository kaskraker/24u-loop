<style>
  :root { --ink: #17120d; --butter: #fff1cf; --orange: #f2a342; --deep: #e8590c; --brown: #863c14; --ok: #2fb344; --muted: #6a5a48; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }

  body { font-family: 'Bricolage Grotesque', system-ui, sans-serif; background: var(--butter); color: var(--ink); padding-bottom: 40px; font-variant-numeric: tabular-nums; }
  header { background: var(--orange); border-bottom: 3px solid var(--ink); padding: 14px 16px 12px; padding-top: max(14px, env(safe-area-inset-top)); }
  header .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header .logo { flex: none; background: #fff; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); padding: 4px 10px; display: flex; }

  #conn:empty { display: none; }
  #conn { max-width: 560px; margin: 0 auto; padding: 2px 20px 6px 14px; }
  #conn div { display: flex; gap: 10px; align-items: center; background: #ffd0c2; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); padding: 8px 12px; font-size: 14px; font-weight: 700; line-height: 1.3; }
  #conn div::before { content: ''; flex: none; width: 10px; height: 10px; border-radius: 50%; background: #e24b4a; animation: livePulse 1.4s ease-in-out infinite; }
  nav button { flex: 1; min-width: 0; font: inherit; font-weight: 800; font-size: 14px; padding: 10px 4px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }

  .card h2 small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .status { border-radius: 16px; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 16px; text-align: center; background: #ffd58a; }
  .status.go { background: #d9f7d0; } .status.run { background: #ffd58a; } .status.none { background: #fff; }
  .status .k { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .status .big { font-size: 52px; font-weight: 800; line-height: 1.05; margin: 2px 0; }
  .status .s { font-size: 14px; font-weight: 500; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 2px; background: #fff6df; border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; } .tile .k { font-size: 11px; font-weight: 700; color: var(--muted); } .tile .v { font-size: 24px; font-weight: 800; }
  .tile .go { position: absolute; right: 10px; top: 6px; font-size: 18px; font-weight: 800; color: var(--muted); }
  .tile:has(.go) .k { padding-right: 16px; }
  .tile.wide { grid-column: span 2; background: #d9f7d0; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; background: #fff6df; margin-bottom: 6px; border: 2px solid transparent; }
  .row.me { background: #ffd58a; border-color: var(--ink); }
  .row .no { width: 26px; font-weight: 800; color: var(--muted); text-align: center; }
  .row .nm { flex: 1; min-width: 0; font-weight: 700; } .row .nm small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
  .row .w { text-align: right; font-weight: 800; font-size: 17px; line-height: 1.1; white-space: nowrap; } .row .w small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .btn { font: inherit; font-weight: 800; border: 3px solid var(--ink); border-radius: 12px; background: var(--orange); color: var(--ink); padding: 10px 14px; box-shadow: 3px 3px 0 var(--ink); font-size: 15px; }

  .btn.full { width: 100%; }

  .lap .t { width: 48px; font-weight: 700; } .lap .n { flex: 1; font-weight: 600; color: var(--muted); } .lap .r { font-weight: 800; font-size: 19px; }
  .badge { font-size: 10px; font-weight: 800; border: 2px solid var(--ink); border-radius: 6px; padding: 1px 6px; background: #ffe27a; margin-left: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 18px 0; font-weight: 500; }
  .rank { display: flex; gap: 10px; padding: 6px 4px; } .rank b { width: 26px; } .rank .nm { flex: 1; font-weight: 600; } .rank .v { font-weight: 800; }
  footer { max-width: 560px; margin: 8px auto 0; padding: 14px 20px 28px 14px; display: flex; gap: 12px; align-items: center; font-size: 11px; color: var(--muted); line-height: 1.4; border-top: 2px dashed #e5d3a8; }
  footer img { flex: none; }
  .modal { position: fixed; inset: 0; z-index: 100; background: rgba(23,18,13,.6); display: flex; align-items: center; justify-content: center; padding: 18px; animation: fadein .15s ease-out; }
  .modal .box { background: #fff1cf; border: 4px solid var(--ink); border-radius: 22px; box-shadow: 7px 7px 0 var(--ink); padding: 20px; width: 100%; max-width: 420px; animation: pop .2s ease-out; }
  .modal h3 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 8px; }
  .modal p { font-weight: 500; line-height: 1.4; margin-bottom: 8px; }
  .modal .eur { display: inline-block; background: var(--orange); border: 3px solid var(--ink); border-radius: 12px; padding: 2px 12px; font-weight: 800; font-size: 20px; margin: 4px 0 10px; box-shadow: 3px 3px 0 var(--ink); }
  .modal .acts { display: grid; gap: 10px; margin-top: 14px; }
  .modal a.btn, .modal button.btn { display: block; text-align: center; text-decoration: none; }
  .btn.ghost { background: #fff; }
  .celeb .box { text-align: center; overflow: hidden; position: relative; background: #ffd58a; }
  .celeb .big { font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; margin: 4px 0 8px; }
  .celeb .time { display: inline-block; font-size: 52px; font-weight: 800; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 0 16px; box-shadow: 4px 4px 0 var(--ink); margin: 4px 0 10px; }
  .celeb .conf { position: absolute; top: -14px; width: 10px; height: 16px; border: 2px solid var(--ink); border-radius: 2px; animation: confFall 2.6s ease-in infinite; }
  @keyframes confFall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(420px) rotate(540deg); opacity: .9; } }
  @keyframes tierGlow { 0%, 100% { box-shadow: 5px 5px 0 var(--ink); } 50% { box-shadow: 0 0 0 8px rgba(232,89,12,.3), 5px 5px 0 var(--ink); } }
  @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
  .alerts { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .alerts .btn.small { font-size: 13px; padding: 6px 12px; }
  .alerts .btn.on { background: #d9f7d0; }
  .turn .box { text-align: center; background: #d9f7d0; animation: pop .2s ease-out, tierGlow 1.2s ease-in-out 3; }
  .turn .big { font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; margin: 4px 0 8px; }
  .foot { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 14px; }

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDVULWNjHaR41EaptoQYnWnTdnU-suMuuA", authDomain: "u-loop-leuven-2026.firebaseapp.com", projectId: "u-loop-leuven-2026",
  storageBucket: "u-loop-leuven-2026.firebasestorage.app", messagingSenderId: "1032849674125", appId: "1:1032849674125:web:110054a3b61ba10eedb7c4"
};
const params = new URLSearchParams(location.search);
const NS = (params.get('ns') || '').replace(/[^a-zA-Z0-9_-]/g, '');
const col = (n) => NS ? `${NS}_${n}` : n;
const EUR_PER_LAP = 5;
const LAP_KM = 0.515;   // lengte van één ronde
// Het event: dinsdag 20 oktober 2026, 20:00 tot woensdag 20:00. In de oefenmodus (?ns=) halen we de start uit de eerste ronde.
const EVENT_START_REAL = Date.parse('2026-10-20T20:00:00+02:00');
let eventStart = NS ? 0 : EVENT_START_REAL;

// Verwachte rondetijd voor een loper zonder eerdere ronde, vast gekozen uit de data van vorig jaar (gemiddelde eerste ronde: mannen 1:34, vrouwen 1:54, overige 1:41).
// Wordt enkel intern gebruikt (piste, wachttijden); bij een eerste ronde tonen we geen verwachte tijd.
const FIRST_LAP_MS = { M: 94000, V: 114000, X: 101000 };
// Bereik op de piste bij een eerste ronde: 80% van de eerste rondes van vorig jaar viel hiertussen (10e tot 90e percentiel; mannen n=200, vrouwen n=125). 'Geen' ligt tussen beide.
const FIRST_LAP_RANGE = { M: [83000, 106000], V: [99000, 133000], X: [91000, 119500] };
const FIRST_LAP_TYPICAL_MS = { M: 92000, V: 112000, X: 99000 };   // meest waarschijnlijke eerste ronde (mediaan): voor de piste; FIRST_LAP_MS (gemiddelde) is voor de wachttijden (sommen)
// Voorspelling van de volgende ronde: recente rondes tellen zwaarder (exponentieel gewogen), gestart vanaf de waarde van vorig jaar per geslacht.
// Op de data van vorig jaar 17% nauwkeuriger dan een gewoon gemiddelde (gemiddelde fout 4,1 s tegenover 5,0 s); een afzonderlijke trend-extrapolatie bleek niet beter.
const EW_FIRST = 0.7, EW_NEXT = 0.6;
// Na een lange rust (vanaf 1 u, volledig effect vanaf 4 u) loopt iemand weer 'fris': dan schuift de voorspelling voor de helft op naar het gemiddelde van de snelste helft van zijn rondes.
// Op de data van vorig jaar: na >2 u rust gemiddelde fout 4,1 s i.p.v. 4,6 s (weinig meetpunten: 58). Uur van de nacht en korte rust gaven geen duidelijke winst.
function predictNext(times, gender, restMs) {
  let e = FIRST_LAP_MS[gender] || FIRST_LAP_MS.X;
  times.forEach((x, i) => { const w = i === 0 ? EW_FIRST : EW_NEXT; e = e * (1 - w) + x * w; });
  if (restMs > 3600e3 && times.length >= 2) {
    const w = Math.min(1, (restMs - 3600e3) / (3 * 3600e3)) * 0.5, sorted = [...times].sort((a, b) => a - b), k = Math.max(1, Math.floor(sorted.length / 2));
    e = e * (1 - w) + (sorted.slice(0, k).reduce((a, b) => a + b, 0) / k) * w;
  }
  return e;
}

// ===== Gedeelde tijd: elk toestel corrigeert zijn eigen klok met de tijd van de server (HTTP Date-header) =====
// Zo lopen de klok op het grote scherm, de chronometer en de gsm's van de lopers gelijk, ook als een klok enkele seconden afwijkt.
let TIME_OFFSET = 0;
const tnow = () => Date.now() + TIME_OFFSET;
async function syncClock() {
  try {
    let lo = -Infinity, hi = Infinity;
    for (let i = 0; i < 6; i++) {
      const t0 = Date.now();
      const res = await fetch(location.pathname + '?_t=' + t0 + '_' + i, { method: 'HEAD', cache: 'no-store' });
      const t1 = Date.now(), d = res.headers.get('Date');
      if (!d) continue;
      const mid = (t0 + t1) / 2, srv = new Date(d).getTime();   // de server rondt af naar beneden op de seconde
      lo = Math.max(lo, srv - mid); hi = Math.min(hi, srv + 1000 - mid);
      await new Promise((r) => setTimeout(r, 170));
    }
    if (isFinite(lo) && isFinite(hi)) {
      const est = lo <= hi ? (lo + hi) / 2 : (lo + hi) / 2;
      if (Math.abs(est) < 10 * 60e3) TIME_OFFSET = est;
    }
  } catch (e) { /* offline: eigen klok blijven gebruiken */ }
}
syncClock(); setInterval(syncClock, 10 * 60e3);


firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();


// ===== Samenvatting voor de lopers-app: de chronometer schrijft elke ~2 min een kleine samenvatting, zodat gsm's niet alle rondes hoeven te lezen =====
function buildMeta(runnersArr, lapsArr) {
  const by = {};
  lapsArr.forEach((l) => { const e = by[l.runnerId] || (by[l.runnerId] = { n: 0, tt: 0, best: Infinity, sq: 0 }); e.n++; e.tt += l.time; if (l.time < e.best) e.best = l.time; });
  lapsArr.forEach((l) => { const e = by[l.runnerId], m = e.tt / e.n; e.sq += (l.time - m) * (l.time - m); });
  const seqs = {}, lastAt = {}; [...lapsArr].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)).forEach((l) => { (seqs[l.runnerId] = seqs[l.runnerId] || []).push(l.time); lastAt[l.runnerId] = new Date(l.timestamp).getTime(); });
  const list = runnersArr.map((r) => { const e = by[r.id]; return { i: r.id, n: r.name || '', g: r.gender || 'X', l: e ? e.n : 0, t: e ? Math.round(e.tt) : 0, b: e ? Math.round(e.best) : 0, s: e && e.n >= 3 ? +(Math.sqrt(e.sq / e.n) / (e.tt / e.n)).toFixed(3) : 0, e: e ? Math.round(predictNext(seqs[r.id] || [], r.gender, Date.now() - (lastAt[r.id] || Date.now()))) : 0 }; });
  const gOf = {}; runnersArr.forEach((r) => { gOf[r.id] = r.gender; });
  const sorted = [...lapsArr].sort((a, b) => a.time - b.time);
  const top = (arr) => arr.slice(0, 10).map((l) => ({ id: l.runnerId, name: l.runnerName, t: l.time, at: l.timestamp }));
  const most = list.filter((x) => x.l > 0).sort((a, b) => b.l - a.l).slice(0, 10).map((x) => ({ id: x.i, name: x.n, n: x.l }));
  const now = Date.now();
  return {
    index: { updatedAt: now, list },
    summary: { updatedAt: now, total: lapsArr.length, record: sorted[0] ? { t: sorted[0].time, name: sorted[0].runnerName } : null,
      top: { fast: top(sorted), fastM: top(sorted.filter((l) => gOf[l.runnerId] === 'M')), fastV: top(sorted.filter((l) => gOf[l.runnerId] === 'V')), most } }
  };
}

// Gegevens in de lopers-app (zuinig): wachtrij + actieve loper + samenvatting + lopersindex; rondes enkel van de gekozen lopers.
let runners = [], queue = [], active = null, SUM = null, rMap = new Map(), MODE = 'lean';
let recent = [];   // de laatste gelopen rondes (live, maximaal 12)
let rawRunners = [], rawLaps = [];            // enkel in 'volledige' modus (als er nog geen samenvatting bestaat, bv. in de oefenmodus zonder chronometer)
const LAPS = {};                              // rondes per loper (enkel van wie we bekijken)
const lapsOf = (id) => LAPS[id] || [];
const getR = (id) => rMap.get(id);
let idxRunners = [];
function applyIndex(list) {
  idxRunners = list.map((a) => ({ id: a.i, name: a.n, gender: a.g, totalLaps: a.l, totalTime: a.t, best: a.b, sd: a.s, exp: a.e }));
  mergeKnown();
}
// Wie net ingeschreven is, staat nog niet in de lopersindex (de chronometer schrijft die hoogstens om de 2 min).
// Zulke lopers nemen we voorlopig over uit de wachtrij, de lopende loper of de laatste rondes, zodat ze meteen hun wachttijd zien.
function mergeKnown() {
  const known = new Set(idxRunners.map((r) => r.id)), extra = [];
  const add = (id, name, gender) => { if (id && name && !known.has(id)) { known.add(id); extra.push({ id, name, gender: gender || 'X', totalLaps: 0, totalTime: 0, best: 0, sd: 0, exp: 0, temp: true }); } };   // klassement staat mee in de wachtrij
  queue.forEach((q) => add(q.runnerId, q.runnerName, q.gender));
  if (active && active.runner) add(active.runner.runnerId, active.runner.runnerName, active.runner.gender);
  recent.forEach((l) => add(l.runnerId, l.runnerName));
  if (me && LAPS[me] && LAPS[me][0]) add(me, LAPS[me][0].runnerName);
  runners = extra.length ? idxRunners.concat(extra) : idxRunners;
  rMap = new Map(runners.map((r) => [r.id, r]));
  if (extra.length && typeof refreshIndexSoon === 'function') refreshIndexSoon();   // snel opnieuw kijken of de index al bijgewerkt is
}
// totaal: de samenvatting (hoogstens ~2 min oud) + de rondes die daarna al binnenkwamen, zodat de euro's meteen meetellen
const totalLaps = () => SUM ? SUM.total + (MODE === 'lean' ? recent.filter((l) => Date.parse(l.timestamp) > SUM.updatedAt).length : 0) : 0;
const ME_KEY = 'myRunnerId' + (NS ? '_' + NS : '');   // per omgeving onthouden (oefen en echt apart)
let me = ''; try { me = localStorage.getItem(ME_KEY) || ''; } catch (e) {}
if (params.get('me')) me = params.get('me');   // testlink: ?me=<runnerId>
let tab = params.get('tab') || 'queue';   // opent altijd bij de wachtrij en de huidige loper
let query = '', squery = '', viewId = '', showAllQ = false;
const $ = (id) => document.getElementById(id);

// ---------- helpers ----------
// zoeken zonder accenten en in eender welke volgorde: "zoe", "Zoë" en "dumoulin kasper" vinden allemaal iemand
const norm = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function findRunners(q, n) { const words = norm(q).split(/\s+/).filter(Boolean); return words.length ? runners.filter((x) => { const nm = norm(x.name); return words.every((w) => nm.includes(w)); }).slice(0, n) : []; }
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mmss = (ms) => { const s = Math.ceil(ms / 1000);   /* zoals in de atletiek naar boven afronden (1:21,1 -> 1:22), net als het grote scherm */ return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const mmssc = (ms) => { const t = Math.max(0, ms); const s = Math.floor(t / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}.${String(Math.floor((t % 1000) / 10)).padStart(2, '0')}`; };
const tenths = (ms) => { const d = Math.ceil(ms / 100); return `${Math.floor(d / 600)}:${String(Math.floor(d / 10) % 60).padStart(2, '0')}<span style="font-size:.68em">,${d % 10}</span>`; };   // ranglijsten (tiende kleiner, zoals in sportuitslagen), handtijd zoals in de atletiek naar boven: 81 930 ms -> 1:22,0 (zelfde als het grote scherm)
const clock = (d) => new Date(d).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });

const isRunning = () => !!(active && active.isRunning && active.runner);

  later();
}
const isStale = () => connOk === false && everOk && Date.now() - lostAt >= 10000;
function connBanner() {
  if (connOk !== false || Date.now() - lostAt < 10000) return '';
  if (!everOk) return 'Geen verbinding met de server. We blijven proberen…';
  const min = Math.floor((Date.now() - lostAt) / 60000);
  return `Geen verbinding sinds ${clock(lostAt)}${min >= 1 ? ` (${min} min)` : ''}. De wachtrij en de tijden kunnen intussen veranderd zijn.`;
}
window.addEventListener('offline', () => setConn(false));
document.addEventListener('visibilitychange', () => { if (!document.hidden) later(); });
const onErr = (err) => { errCode = err.code || ''; setConn(false); };
const snap = (name, fn) => db.collection(col(name)).onSnapshot({ includeMetadataChanges: true }, (s) => { setConn(!s.metadata.fromCache); fn(s); later(); }, onErr);
const metaDoc = (id) => db.collection(col('meta')).doc(id);
const lapSubs = {};
function syncWatches() {   // rondes ophalen van enkel de gekozen lopers (jezelf en wie je bekijkt)
  if (MODE !== 'lean') return;
  const want = new Set([me, viewId].filter(Boolean));
  Object.keys(lapSubs).forEach((id) => { if (!want.has(id)) { lapSubs[id](); delete lapSubs[id]; delete LAPS[id]; } });
  want.forEach((id) => { if (!lapSubs[id]) lapSubs[id] = db.collection(col('laps')).where('runnerId', '==', id).onSnapshot((s) => { LAPS[id] = s.docs.map((d) => ({ id: d.id, ...d.data() })); later(); }, onErr); });
}
function startCommon() {
  if (NS) db.collection(col('laps')).orderBy('timestamp').limit(1).get().then((s) => { if (!s.empty) setStartFrom(s.docs[0].data().timestamp); }).catch(() => {});
  snap('queue', (s) => { if (!s.metadata.fromCache) queueLoaded = true; queue = s.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(a.addedAt) - new Date(b.addedAt)); });
  db.collection(col('laps')).orderBy('timestamp', 'desc').limit(12).onSnapshot((s) => { recent = s.docs.map((d) => ({ id: d.id, ...d.data() })); if (NS && recent.length) setStartFrom(recent[recent.length - 1].timestamp); later(); }, onErr);
  snap('activeRunner', (s) => { const d = s.docs.find((x) => x.id === 'current') || s.docs[0]; active = d ? d.data() : null; });
}
function startLean() {
  MODE = 'lean'; startCommon();
  metaDoc('summary').onSnapshot((s) => { if (s.exists) { SUM = s.data(); later(); } }, onErr);
  let idxAt = 0, idxUpd = 0, soonWait = 20000;
  const loadIndex = () => { idxAt = Date.now(); metaDoc('runnerIndex').get().then((s) => { if (s.exists) { const d = s.data();
    soonWait = d.updatedAt && d.updatedAt === idxUpd ? Math.min(soonWait * 2, 300000) : 20000;   // index onveranderd (chronometer even weg)? dan minder vaak opnieuw proberen
    idxUpd = d.updatedAt || 0; applyIndex(d.list || []); later(); } }).catch(() => {}); };
  window.refreshIndex = () => { if (Date.now() - idxAt > 60000) loadIndex(); };   // bij uitklappen van een klassement: verse gegevens
  window.refreshIndexSoon = () => { if (Date.now() - idxAt > soonWait) loadIndex(); };   // er is een nieuwe loper die nog niet in de index staat
  loadIndex(); setInterval(loadIndex, 10 * 60e3);
  window.addEventListener('focus', () => { if (Date.now() - idxAt > 120000) loadIndex(); });
}
function startHeavy() {   // geen samenvatting beschikbaar: alles lezen (enkel voor oefenen zonder chronometer)
  MODE = 'heavy'; startCommon();
  const rebuild = () => { const m = buildMeta(rawRunners, rawLaps); SUM = m.summary; applyIndex(m.index.list); Object.keys(LAPS).forEach((k) => delete LAPS[k]); rawLaps.forEach((l) => { (LAPS[l.runnerId] = LAPS[l.runnerId] || []).push(l); }); };
  snap('runners', (s) => { rawRunners = s.docs.map((d) => ({ id: d.id, ...d.data() })); rebuild(); });
  snap('laps', (s) => { rawLaps = s.docs.map((d) => ({ id: d.id, ...d.data() })); rebuild(); });
}
(function boot(tries) {
  metaDoc('summary').get().then((d) => { if (d.exists) startLean(); else startHeavy(); }).catch((e) => { if (tries < 4) setTimeout(() => boot(tries + 1), 2500); else startHeavy(); });
})(0);

// levende klok + piste bijwerken (zonder de pagina opnieuw op te bouwen).
// Zuinig voor de batterij: enkel als er iets live te zien is en de app zichtbaar is, en ~20 keer per seconde i.p.v. elk beeld (ziet er even vlot uit).
let liveEls = [], trackEls = [], loopOn = false;
function collectLive() {   // na elke wijziging van de pagina: de live-elementen één keer opzoeken i.p.v. bij elke tik
  liveEls = [...document.querySelectorAll('[data-live]')].filter((el) => Number(el.dataset.live));
  trackEls = [...document.querySelectorAll('svg[data-track]')];
  liveTick(); wakeLoop();
}
function liveTick() {
  const now = tnow();
  liveEls.forEach((el) => { el.textContent = mmssc(now - Number(el.dataset.live)); });
  trackEls.forEach((el) => {
    const e = Math.max(0, now - Number(el.dataset.start)), hi = Math.min(1, e / Number(el.dataset.fast)), lo = Math.max(0, Math.min(hi - 0.05, e / Number(el.dataset.slow)));
    el.querySelector('.tlo').setAttribute('stroke-dasharray', `${Math.max(0.001, lo)} 2`);
    const h2 = el.querySelector('.thi'); h2.setAttribute('stroke-dasharray', `${Math.max(0.001, hi - lo)} 2`); h2.setAttribute('stroke-dashoffset', -lo);
  });
}
const hasLive = () => liveEls.length > 0 || trackEls.length > 0;
function wakeLoop() { if (loopOn || document.hidden || !hasLive()) return; loopOn = true; requestAnimationFrame(frame); }
function frame() {
  if (document.hidden || !hasLive()) { loopOn = false; return; }   // niets live of op de achtergrond: lus stopt (wakeLoop start hem weer)
  liveTick(); setTimeout(() => requestAnimationFrame(frame), 40);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { liveTick(); wakeLoop(); } });
setInterval(() => { if (document.hidden) return; const ae = document.activeElement && document.activeElement.id; if (ae !== 'q' && ae !== 'sq') render(true); }, 10000);   // op de achtergrond niet; bij terugkeren wordt meteen bijgewerkt
render(true);
</script>
</body>
