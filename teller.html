<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2a342">
<title>24u Loop · Teller</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #17120d; --butter: #fff1cf; --orange: #f2a342; --deep: #e8590c; --muted: #6a5a48; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--butter); color: var(--ink); cursor: none; font-family: 'Bricolage Grotesque', system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #top { position: fixed; left: 4vw; top: 5vh; z-index: 2; }
  #logos { display: flex; align-items: stretch; gap: 2.4vh; }
  .lg { display: flex; align-items: center; background: #fff; border: .45vh solid var(--ink); border-radius: 2.2vh; box-shadow: .8vh .8vh 0 var(--ink); padding: 1.2vh 2.4vh; }
  .lg img { display: block; width: auto; }
  .lg .wfa { height: 11vh; }
  .lg .ac { height: 8vh; }
  #amount { margin-top: 2.5vh; display: flex; align-items: baseline; white-space: nowrap; font-weight: 800; font-size: min(18vw, 35vh); line-height: .95; letter-spacing: -.035em; transform-origin: 0 70%; }
  #amount.bump { animation: bump .6s cubic-bezier(.2, 1.5, .4, 1); }
  @keyframes bump { 0% { transform: scale(1.045); } 100% { transform: scale(1); } }
  .cur { font-size: .48em; margin-right: .1em; }
  .dig { display: inline-block; height: 1em; width: .6em; overflow: hidden; }
  .dig i { display: block; font-style: normal; transition: transform 1.1s cubic-bezier(.2, .85, .25, 1); transform: translateY(calc(var(--d, 0) * -1em)); }
  .dig b { display: block; height: 1em; line-height: 1; text-align: center; font-weight: inherit; }
  .sep { display: inline-block; width: .22em; text-align: center; }
  #cap { margin-top: .4vh; font-size: 4.2vh; font-weight: 700; }
  #next { margin-left: 1.4vh; font-size: 3vh; font-weight: 700; color: var(--muted); }
  #ms { position: fixed; inset: 0; z-index: 4; background: var(--orange); display: flex; flex-direction: column; align-items: center; justify-content: center; clip-path: inset(0 100% 0 0); pointer-events: none; }
  #ms.show { animation: wipe 6s cubic-bezier(.7, 0, .2, 1) forwards; }
  @keyframes wipe { 0% { clip-path: inset(0 100% 0 0); } 9% { clip-path: inset(0 0 0 0); } 88% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 0 0 100%); } }
  #ms span { font-size: 4.6vh; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; }
  #ms b { font-size: min(19vw, 34vh); font-weight: 800; line-height: 1; letter-spacing: -.03em; text-shadow: 1.2vh 1.2vh 0 #fff1cf; margin: 1vh 0 4vh; }
  #ms.show b { animation: grow 6s ease-out forwards; }
  @keyframes grow { 0%, 8% { transform: scale(.85); } 20% { transform: scale(1.02); } 100% { transform: scale(1.07); } }
  #ms .lg .wfa { height: 10vh; }
  #dot { position: fixed; right: 1.4vh; bottom: 1.4vh; width: 1.2vh; height: 1.2vh; border-radius: 50%; background: var(--deep); opacity: 0; transition: opacity .5s; z-index: 3; }
  #dot.on { opacity: .9; }

<body>
<canvas id="c"></canvas>
<div id="top">
  <div id="logos"><div class="lg"><img class="wfa" src="water-for-all-logo.png" alt="Water for All"></div><div class="lg"><img class="ac" src="atlas-copco-logo.png" alt="Atlas Copco"></div></div>
  <div id="amount"></div>

</div>
<div id="ms"><span>Mijlpaal</span><b id="msAmount"></b><div class="lg"><img class="wfa" src="water-for-all-logo.png" alt="Water for All"></div></div>
<div id="dot"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
// ===== Instellingen =====
const EUR_PER_LAP = 5;
const TANK_EUR = 100, TANK_LAPS = TANK_EUR / EUR_PER_LAP;   // een ton is vol bij € 100 en gaat dan op de pallet
const MILESTONE_EUR = 500, MILESTONE_LAPS = MILESTONE_EUR / EUR_PER_LAP;
const params = new URLSearchParams(location.search);
const NS = (params.get('ns') || '').replace(/[^a-zA-Z0-9_-]/g, '');
const DEMO = params.has('demo');
// Einde: woensdag 21 oktober 2026 om 20:00 (wat dan nog loopt, telt niet; daarna blijft de eindstand staan). Testen: ?ns=oefen&einde=21:30
const parseEnd = (v) => { if (!v) return null; const m = /^(\d{1,2})[:.h](\d{2})$/.exec(v.trim()); if (m) { const d = new Date(); d.setHours(+m[1], +m[2], 0, 0); return d.getTime(); } const t = Date.parse(v); return isNaN(t) ? null : t; };
const EVENT_END = ((NS || DEMO) && parseEnd(params.get('einde'))) || (NS || DEMO ? Infinity : Date.parse('2026-10-21T20:00:00+02:00'));
const ended = () => tnow() >= EVENT_END;
const col = (n) => NS ? `${NS}_${n}` : n;
const fmt = (n) => Math.round(n).toLocaleString('nl-BE');
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutBack = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOutBounce = (x) => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; };

// Verwachte rondetijd en bereik: zelfde regels als de piste op het grote scherm en in de lopers-app
const FIRST_LAP_MS = { M: 94000, V: 114000, X: 101000 };
const FIRST_LAP_TYPICAL_MS = { M: 92000, V: 112000, X: 99000 };
const FIRST_LAP_RANGE = { M: [83000, 106000], V: [99000, 133000], X: [91000, 119500] };

// ===== Gedeelde tijd (klok van de server, zoals de andere apps) =====
let TIME_OFFSET = 0;
const tnow = () => Date.now() + TIME_OFFSET;
async function syncClock() {
  try {
    let lo = -Infinity, hi = Infinity;
    for (let i = 0; i < 6; i++) {
      const t0 = Date.now();
      const res = await fetch(location.pathname + '?_t=' + t0 + '_' + i, { method: 'HEAD', cache: 'no-store' });
      const t1 = Date.now(), d = res.headers.get('Date');
      if (!d) continue;
      const mid = (t0 + t1) / 2, srv = new Date(d).getTime();
      lo = Math.max(lo, srv - mid); hi = Math.min(hi, srv + 1000 - mid);
      await new Promise((r) => setTimeout(r, 170));
    }
    if (isFinite(lo) && isFinite(hi)) { const est = (lo + hi) / 2; if (Math.abs(est) < 10 * 60e3) TIME_OFFSET = est; }
  } catch (e) {}
}

// ===== Gegevens =====
let realLaps = null, SUM = null, recent = [], fullCount = null, active = null, lastOk = Date.now();
const runnerIdx = new Map();   // id → { l: volle rondes (zonder startronde), t: totale tijd, b: beste, s: spreiding, e: verwachte volgende ronde, g }
function lapsNow() {
  if (fullCount != null) return fullCount;
  if (!SUM) return null;
  return SUM.total + recent.filter((l) => Date.parse(l.timestamp) > (SUM.updatedAt || 0) && Date.parse(l.timestamp) <= EVENT_END).length;
}
function pushLaps() { const n = lapsNow(); if (n != null) realLaps = n; }
const isRunning = () => !!(active && active.isRunning && active.runner && active.startTime) && !ended();
function lapRange() {   // { fast, slow } voor de lopende loper
  const rid = active.runner.runnerId, r = runnerIdx.get(rid), gender = (r && r.g) || active.runner.gender || 'X';
  const n = r ? r.l : 0, best = r && r.b ? r.b : 0;
  const ex = n ? (r.e || (r.t + (FIRST_LAP_MS[gender] || FIRST_LAP_MS.X) * 2) / (n + 2)) : (FIRST_LAP_TYPICAL_MS[gender] || FIRST_LAP_TYPICAL_MS.X);
  const rel = Math.max(0.06, Math.min(0.25, n >= 3 && r.s ? r.s : 0.15));
  const first = FIRST_LAP_RANGE[gender] || FIRST_LAP_RANGE.X;
  const fast = best ? Math.max(ex * (1 - rel), best * 0.99) : first[0], slow = best ? Math.max(ex * (1 + rel), fast * 1.08) : first[1];
  return { fast, slow };
}
function startFirebase() {
  syncClock(); setInterval(syncClock, 10 * 60e3);
  firebase.initializeApp({
    apiKey: "AIzaSyDVULWNjHaR41EaptoQYnWnTdnU-suMuuA", authDomain: "u-loop-leuven-2026.firebaseapp.com", projectId: "u-loop-leuven-2026",
    storageBucket: "u-loop-leuven-2026.firebasestorage.app", messagingSenderId: "1032849674125", appId: "1:1032849674125:web:110054a3b61ba10eedb7c4"
  });
  const db = firebase.firestore();
  const ok = (s) => { if (!s.metadata.fromCache) lastOk = Date.now(); };
  let unsubFull = null, staleT = null;
  const startFull = () => { if (!unsubFull) unsubFull = db.collection(col('laps')).onSnapshot((s) => { ok(s); fullCount = s.docs.filter((d) => Date.parse(d.data().timestamp) <= EVENT_END).length; pushLaps(); }, () => {}); };
  const checkStale = () => {   // samenvatting van de chronometer veel ouder dan de nieuwste ronde: zelf tellen
    const stale = () => fullCount == null && SUM && recent.length && Date.parse(recent[0].timestamp) - (SUM.updatedAt || 0) > 10 * 60e3;
    if (!stale()) { clearTimeout(staleT); staleT = null; return; }
    if (!staleT) staleT = setTimeout(() => { staleT = null; if (stale()) startFull(); }, 30000);
  };
  const meta = db.collection(col('meta'));
  meta.doc('summary').onSnapshot({ includeMetadataChanges: true }, (s) => { ok(s); if (s.exists) { SUM = s.data(); checkStale(); pushLaps(); } else if (!SUM) startFull(); }, () => {});
  db.collection(col('laps')).orderBy('timestamp', 'desc').limit(12).onSnapshot({ includeMetadataChanges: true }, (s) => { ok(s); recent = s.docs.map((d) => d.data()); checkStale(); pushLaps(); }, () => {});
  db.collection(col('activeRunner')).onSnapshot((s) => { const d = s.docs.find((x) => x.id === 'current') || s.docs[0]; active = d ? d.data() : null; }, () => {});
  const loadIndex = () => meta.doc('runnerIndex').get().then((s) => { if (s.exists) (s.data().list || []).forEach((a) => runnerIdx.set(a.i, { l: a.f != null ? a.f : a.l, t: a.t, b: a.b, s: a.s, e: a.e, g: a.g })); }).catch(() => {});
  loadIndex(); setInterval(loadIndex, 2 * 60e3);
  setTimeout(() => { if (realLaps == null) realLaps = 0; }, 6000);
}
// Demo: ?demo=1&laps=17. Rondes van 13 à 17 s. Spatie = ronde klaar, T = vlak voor een volle ton, M = vlak voor een mijlpaal.
function startDemo() {
  realLaps = parseInt(params.get('laps') || '0', 10) || 0;
  const names = ['Jana Peeters', 'Wout Claes', 'Lotte Janssens', 'Arne Maes', 'Fien Willems', 'Seppe Jacobs', 'Noor Mertens', 'Ruben Goossens'];
  let k = 0, endT = null;
  const next = () => {
    const id = 'd' + (k % names.length), ex = rnd(13000, 17000);
    runnerIdx.set(id, { l: 4, t: ex * 4, b: ex * 0.9, s: 0.1, e: ex, g: 'X' });
    active = { isRunning: true, startTime: new Date(tnow()).toISOString(), runner: { runnerId: id, runnerName: names[k % names.length], gender: 'X' } };
    k++; clearTimeout(endT); endT = setTimeout(finish, ex * rnd(0.92, 1.12));
  };
  const finish = () => { realLaps++; next(); };
  setTimeout(next, 1500);
  addEventListener('keydown', (e) => {
    if (e.key === ' ') finish();
    else if (e.key === 't') jumpTo(Math.floor(shownLaps / TANK_LAPS) * TANK_LAPS + TANK_LAPS - 1);
    else if (e.key === 'm') jumpTo(Math.floor(shownLaps / MILESTONE_LAPS) * MILESTONE_LAPS + MILESTONE_LAPS - 1);
  });
}

// ===== Bedrag (kilometerteller) =====
const amountEl = document.getElementById('amount');
let digitEls = [], shownText = '';
function buildAmount(euro, zero) {
  const s = fmt(euro);
  amountEl.innerHTML = '<span class="cur">€</span>' + [...s].map((ch) => /\d/.test(ch)
    ? `<span class="dig"><i style="--d:${zero ? 0 : ch}">${'0123456789'.replace(/./g, '<b>$&</b>')}</i></span>` : `<span class="sep">${ch}</span>`).join('');
  digitEls = [...amountEl.querySelectorAll('.dig i')]; shownText = s; fitAmount();
}
function setAmount(euro) {
  const s = fmt(euro);
  if (s.length !== shownText.length) { buildAmount(euro); return; }
  let k = 0; [...s].forEach((ch) => { if (/\d/.test(ch)) digitEls[k++].style.setProperty('--d', ch); });
  shownText = s;
}
function fitAmount() {   // nooit tot aan de paal van de kantelbak
  amountEl.style.fontSize = '';
  const max = Math.min(innerWidth * 0.58, (POST_X - 50) * SC - amountEl.getBoundingClientRect().left), w = amountEl.scrollWidth;
  if (w > max) amountEl.style.fontSize = `calc(min(18vw, 35vh) * ${(max / w).toFixed(3)})`;
}
function bump() { amountEl.classList.remove('bump'); void amountEl.offsetWidth; amountEl.classList.add('bump'); }
function renderNext() {
  if (ended()) { document.getElementById('next').textContent = `eindstand · ${fmt(shownLaps)} rondes`; return; }
  const euro = shownLaps * EUR_PER_LAP, goal = (Math.floor(shownLaps / MILESTONE_LAPS) + 1) * MILESTONE_EUR;
  document.getElementById('next').textContent = `nog € ${fmt(goal - euro)} tot € ${fmt(goal)}`;
}

// ===== Tekenvlak: virtuele hoogte 1000, breedte volgens het scherm =====
const cv = document.getElementById('c'), g = cv.getContext('2d');
let CW = 0, CH = 0, SC = 1, DPR = 1, VW = 1778;
const FLOOR = 935, TW = 420, TH = 360;     // vloer, breedte en hoogte van de grote ton
let TANK_CX, AX, AY = 338, NZ_X, NZ_Y = 188, POST_X, ST_X0, ST_X1, ST_TOP = 660;
function layout() {
  VW = 1000 * CW / CH;
  TANK_CX = Math.max(VW * 0.7, VW - 390); AX = TANK_CX - 120; NZ_X = AX; POST_X = TANK_CX - TW / 2 - 75;
  ST_X0 = VW * 0.04; ST_X1 = POST_X - 70;
}
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); CW = innerWidth; CH = innerHeight; SC = CH / 1000;
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
  layout(); fitAmount(); if (started) stackS = stackTarget();
  if (main && !enter) main.cx = TANK_CX;   // bv. bij volledig scherm: de ton schuift mee met de kantelbak
}
addEventListener('resize', resize);
const INK = '#17120d', CREAM = '#fff9ea', ORANGE = '#f2a342', WOOD = '#d9a066', WATER = '#3db4e6', WATER2 = '#0b74ad', FOAM = '#eafaff';
const LW = 6, SH = 9;
function bold(path, fill, shadow, lw) {
  if (shadow) { g.save(); g.translate(shadow, shadow); path(); g.fillStyle = INK; g.fill(); g.restore(); }
  path(); if (fill) { g.fillStyle = fill; g.fill(); }
  g.lineWidth = lw || LW; g.strokeStyle = INK; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke();
}
function rrect(x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function pipe(path, w) {   // buis: dikke zwarte lijn met een lichte binnenkant
  g.lineCap = 'round'; g.lineJoin = 'round';
  path(); g.lineWidth = w + LW * 2; g.strokeStyle = INK; g.stroke();
  path(); g.lineWidth = w; g.strokeStyle = CREAM; g.stroke();
  path(); g.lineWidth = w * 0.22; g.strokeStyle = 'rgba(255,255,255,.9)'; g.save(); g.translate(-w * 0.22, -w * 0.22); g.stroke(); g.restore();
}

// ===== Polygonen: oppervlakte onder een waterlijn (voor het water in de kantelbak) =====
function clipBelow(poly, yw) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], ain = a.y >= yw, bin = b.y >= yw;
    if (ain) out.push(a);
    if (ain !== bin) { const t = (yw - a.y) / (b.y - a.y); out.push({ x: a.x + (b.x - a.x) * t, y: yw }); }
  }
  return out;
}
function area(p) { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a.x * b.y - b.x * a.y; } return Math.abs(s) / 2; }
function surfaceFor(poly, A) {   // waterlijn waaronder precies A oppervlakte ligt
  let lo = Infinity, hi = -Infinity; poly.forEach((p) => { lo = Math.min(lo, p.y); hi = Math.max(hi, p.y); });
  for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; if (area(clipBelow(poly, m)) > A) lo = m; else hi = m; }
  return (lo + hi) / 2;
}

// ===== Kantelbak (maatbeker op een as) =====
const JUG = { L: [-80, -95], R: [80, -95], BR: [60, 105], BL: [-60, 105], BEAK: [96, -107] };
const JUG_LOCAL = [JUG.L, JUG.R, JUG.BR, JUG.BL].map(([x, y]) => ({ x, y }));
const A_MAX = area(clipBelow(JUG_LOCAL, -95 + 14));   // vol = 14 onder de rand
const levelY = (v) => surfaceFor(JUG_LOCAL, v * A_MAX);   // lokale hoogte van een vulgraad, rechtop
let th = 0, om = 0, thTarget = 0;   // hoek, hoeksnelheid, doelhoek
const jp = ([x, y]) => { const c = Math.cos(th), s = Math.sin(th); return { x: AX + x * c - y * s, y: AY + x * s + y * c }; };
const jugPoly = () => [jp(JUG.L), jp(JUG.R), jp(JUG.BR), jp(JUG.BL)];

// ===== Grote ton + golfjes =====
const M = 64, wh = new Float32Array(M), wv = new Float32Array(M), wl = new Float32Array(M), wr = new Float32Array(M);
function waveStep() {
  for (let i = 0; i < M; i++) { wv[i] += -0.028 * wh[i] - 0.045 * wv[i]; wh[i] += wv[i]; }
  for (let p = 0; p < 3; p++) {
    for (let i = 0; i < M; i++) { if (i > 0) { wl[i] = 0.2 * (wh[i] - wh[i - 1]); wv[i - 1] += wl[i]; } if (i < M - 1) { wr[i] = 0.2 * (wh[i] - wh[i + 1]); wv[i + 1] += wr[i]; } }
    for (let i = 0; i < M; i++) { if (i > 0) wh[i - 1] += wl[i]; if (i < M - 1) wh[i + 1] += wr[i]; }
  }
}
function kick(x, amp) {
  if (!main) return;
  const c = Math.round((x - (main.cx - TW / 2)) / TW * (M - 1));
  for (let k = -3; k <= 3; k++) { const i = c + k; if (i >= 0 && i < M) wv[i] += amp * Math.exp(-k * k / 4); }
}
const tankLevelY = (lv) => FLOOR - 14 - lv * (TH - 54);
function tankY(x, t) {
  const f = clamp((x - (main.cx - TW / 2)) / TW, 0, 1) * (M - 1), i = Math.floor(f), j = Math.min(M - 1, i + 1);
  return tankLevelY(main.lvl) - lerp(wh[i], wh[j], f - i) + Math.sin(x * 0.021 + t * 1.5) * 2.2 + Math.sin(x * 0.047 - t * 2.2) * 1.2;
}

// ===== Toestand =====
let started = false, shownLaps = 0, time = 0;
let A = 0, wob = 0, wobX = 0, activeKey = '', hold = null;
let pour = null;                 // { n, A0, phase, t, counted, tankStart }
let main = null;                 // ton onder de kantelbak: { cx, lvl, lid, lidDrop, stamp }
let seq = null, fly = null, enter = null;
let stackCount = 0, stackS = 0.2, landT = 9;
let lever = 0, leverV = 0, drip = 0, dripWait = 0;
const drops = [], specks = [], foam = [], rings = [];
const ST = { on: false, t0: 0, t1: -99, lip: { x: 0, y: 0 }, vx: 0, w: 0 };   // straal: werpbaan van de tuit tot in de ton

const newBarrel = (cx, lvl) => ({ cx, lvl, lid: false, lidDrop: 0, stamp: 0 });
function jumpTo(n) {   // stil naar een stand springen (opstarten, grote inhaalbeweging, demo-toetsen)
  realLaps = Math.max(realLaps || 0, n); shownLaps = n; pour = null; seq = null; fly = null; enter = null; th = om = thTarget = 0;
  stackCount = Math.floor(n / TANK_LAPS); stackS = stackTarget();
  main = newBarrel(TANK_CX, (n % TANK_LAPS) / TANK_LAPS); wh.fill(0); wv.fill(0);
  setAmount(n * EUR_PER_LAP); renderNext();
}
function glassTarget() {
  if (!isRunning()) return 0;
  const el = tnow() - new Date(active.startTime).getTime(), { fast, slow } = lapRange();
  if (el <= 0) return 0;
  if (el < fast) return 0.8 * el / fast;                                  // tot de snelste verwachte tijd: 80% vol
  if (el < slow) return 0.8 + 0.17 * (el - fast) / (slow - fast);          // binnen het bereik
  return 0.97 + 0.02 * (1 - Math.exp(-(el - slow) / 20000));               // trager: vlak onder de rand
}

// ===== Pallets: 10 tonnen per pallet (4-3-2-1), dus € 1.000 per pallet =====
const ROWS = [4, 3, 2, 1];
function stackTarget() {
  const n = Math.max(1, Math.ceil((stackCount + 1) / 10)), w = ST_X1 - ST_X0, h = FLOOR - ST_TOP;
  const bwW = w / (n * 4.5 + (n - 1) * 0.5), bwH = h / 3.75;
  return Math.min(bwW, bwH, 120) / TW;

    g.beginPath(); for (let x = mnx - 10, f = true; x <= mxx + 10; x += 6, f = false) f ? g.moveTo(x, wave(x) + 2.5) : g.lineTo(x, wave(x) + 2.5);

    rings.forEach((r) => { const k = r.t / 0.5; g.globalAlpha = 1 - k; g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.ellipse(r.x, yw + 2, 8 + k * 34, 2 + k * 5, 0, 0, 6.3); g.stroke(); g.globalAlpha = 1; });
    g.restore();
  }
  drawSpecks(true);
  // wanden (open bovenaan) met tuitje
  const pB = jp(JUG.BEAK), pR = jp(JUG.R), pBR = jp(JUG.BR), pBL = jp(JUG.BL), pL = jp(JUG.L);
  g.beginPath(); g.moveTo(pB.x, pB.y); g.lineTo(pR.x, pR.y); g.lineTo(pBR.x, pBR.y); g.lineTo(pBL.x, pBL.y); g.lineTo(pL.x, pL.y);
  g.lineWidth = 7; g.strokeStyle = INK; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke();
  const h1 = jp([-60, -72]), h2 = jp([-47, 78]);
  g.beginPath(); g.moveTo(h1.x, h1.y); g.lineTo(h2.x, h2.y); g.lineWidth = 5; g.strokeStyle = 'rgba(255,255,255,.95)'; g.stroke();
  // as
  bold(() => { g.beginPath(); g.arc(AX, AY, 15, 0, 6.3); }, CREAM, 0, 5);
  g.fillStyle = INK; g.beginPath(); g.arc(AX, AY, 4.5, 0, 6.3); g.fill();
}
function drawName() {   // onder de kantelbak, rechts van de paal: loopt nooit over de paal of de ton; lange namen op twee regels
  if (!isRunning() || pour || seq) return;
  const name = (active.runner.runnerName || '').trim(), x = POST_X + 36, maxW = TANK_CX + TW / 2 + 10 - x;
  const font = (fs) => { g.font = `800 ${fs}px "Bricolage Grotesque", sans-serif`; };
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let fs = 40, lines = [name]; font(fs);
  while (fs > 32 && g.measureText(name).width > maxW) font(fs -= 2);
  if (g.measureText(name).width > maxW && name.includes(' ')) {   // splitsen bij de spatie het dichtst bij het midden
    const sp = [...name].map((c, i) => c === ' ' ? i : -1).filter((i) => i > 0), mid = name.length / 2;
    const k = sp.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a);
    lines = [name.slice(0, k), name.slice(k + 1)];
    fs = 36; font(fs);
    while (fs > 22 && Math.max(...lines.map((l) => g.measureText(l).width)) > maxW) font(fs -= 2);
  } else while (fs > 22 && g.measureText(name).width > maxW) font(fs -= 2);
  const y0 = lines.length > 1 ? AY + 176 : AY + 194;
  g.fillStyle = INK; lines.forEach((l, i) => g.fillText(l, x, y0 + i * fs * 1.08));
  g.fillStyle = '#6a5a48'; g.font = '700 26px "Bricolage Grotesque", sans-serif'; g.fillText('loopt nu', x, y0 - fs - 4);
}

let last = 0, acc = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts;
  update(dt);
  acc += dt; while (acc > 1 / 60) { waveStep(); acc -= 1 / 60; }
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, CW, CH);
  g.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0);
  g.fillStyle = INK; g.fillRect(-10, FLOOR, VW + 20, 5);   // vloer
  drawStand();
  drawStack(time);
  if (main) drawBarrel(main, main.cx, FLOOR, 1, time, true);
  drawFly(time);
  drawStream();
  drawSpecks(false);
  drawJug(time);
  drawFaucet();
  drawName();
  document.getElementById('dot').classList.toggle('on', !DEMO && Date.now() - lastOk > 15000);
  requestAnimationFrame(frame);
}

// ===== Opstarten =====
resize();
if (DEMO) startDemo(); else startFirebase();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(fitAmount);
requestAnimationFrame(frame);
let endShown = false; setInterval(() => { if (!endShown && ended() && started) { endShown = true; renderNext(); } }, 1000);   // om 20:00: de eindstand
const keep = () => { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} };
keep(); document.addEventListener('visibilitychange', () => { if (!document.hidden) keep(); });
const full = () => { if (!document.fullscreenElement) { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p) p.catch(() => {}); } else document.exitFullscreen(); };
addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') full(); });
addEventListener('dblclick', full);
</script>
